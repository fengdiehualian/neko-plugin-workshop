name: Verify N.E.K.O Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market_verify:
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-verify.yml@main
    with:
      plugin-id: claude_code_adapter
      neko-ref: main

  verify:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    
    - name: Install dependencies
      run: |
        uv venv
        uv pip install pytest
    
    - name: Run smoke tests
      run: |
        uv run pytest tests/test_smoke.py -v --import-mode=importlib
