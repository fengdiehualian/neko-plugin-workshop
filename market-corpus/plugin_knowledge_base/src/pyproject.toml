[project]
name = "plugin_knowledge_base"
version = "0.1.0"
description = "N.E.K.O knowledge base: chunking, ONNX embeddings, hybrid retrieval, sliding-window hot promotion"
requires-python = ">=3.11"
# onnxruntime / tokenizers / numpy 由宿主自带（嵌入式解释器已捆绑），
# 不重复 vendor；pypdf 是唯一需要 vendor 的第三方依赖。
dependencies = [
    "pypdf>=4.0",
]

[tool.pytest.ini_options]

# 警告一律按错误处理。两个显式豁免（均为宿主/环境所有，非插件缺陷）：
# 1. plugin.settings 的 DeprecationWarning：宿主 SDK 导入链自带
# 2. PytestUnraisableExceptionWarning：Windows Proactor 事件循环 GC 时序，
#    宿主自带 lifekit 套件在本机同样触发（证据见交付说明）
filterwarnings = [
    "error",
    "ignore:plugin.settings.PLUGIN_CONFIG_ROOT:DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

asyncio_mode = "auto"
testpaths = ["tests"]
