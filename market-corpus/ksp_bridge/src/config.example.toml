# 和猫娘一起坐火箭（KSP）—— 配置示例
#
# 实际的配置在 N.E.K.O 的插件设置里改，这个文件只是说明每个选项的含义。

[ksp_bridge]

# N.E.K.O-KSP-bridge 模组在游戏内监听的地址。
#
# 改端口要改**两处**：
#   1. 模组侧  <KSP>/GameData/N.E.K.O-KSP-bridge/neko-ksp-bridge.ini 里的 port
#   2. 这里的 bridge_url
# 只改一处两边就连不上。模组侧改完需要重启游戏。
bridge_url = "http://127.0.0.1:21579"

# 单次请求超时（秒），范围 3-60。
#
# KSP 在下面这些时刻可能会卡一下，读遥测就会慢一拍：
#   - 正在加载存档 / 切换场景
#   - 开了高倍时间加速
#   - 存档很大、飞船很多
# 模组侧读的是主线程缓存好的快照，正常响应在毫秒级；只有游戏卡住时才会慢。
# 所以这里故意设得短：宁可快速失败说「读不到」，也不要让角色沉默十几秒
# 等一个八成会超时的请求。机器慢可以自己调大。
timeout_seconds = 6

# ── 自动播报 ──────────────────────────────────────────────────────
#
# 开启后，只要游戏在跑，插件就会在后台自己读遥测，把最新的飞船状况
# 塞进角色的上下文里。它用的是「只读不打断」的方式：不会突然插话，
# 但主人下次开口时，角色已经知道你现在飞在哪儿、还有多少燃料。
# 关掉就退回旧的问答式行为：你问了才去读。
auto_brief_enabled = true

# 自动播报的轮询间隔（秒），范围 5-300。
#
# 队列里同一时刻只保留最新一条（coalesce），所以调小不会把上下文撑爆，
# 只是更费一点本机 CPU。15 秒足够跟上一次变轨/一次点火；高倍加速时可以调大。
auto_brief_interval_seconds = 15
