# 和猫娘一起开火箭（朱诺新起源）—— 配置示例
#
# 实际的配置在 N.E.K.O 的插件设置里改，这个文件只是说明每个选项的含义。

[juno_bridge]

# N.E.K.O-Juno-bridge 模组在游戏内监听的地址。
#
# 改端口要改**两处**：
#   1. 模组侧  游戏目录/BepInEx/config/ 里 neko-juno-bridge 的端口设置
#   2. 这里的 bridge_url
# 只改一处两边就连不上。模组侧改完需要重启游戏。
bridge_url = "http://127.0.0.1:21577"

# 单次请求超时（秒），范围 3-60。
#
# 游戏在下面这些时刻可能会卡一下，读遥测就会慢一拍：
#   - 正在加载存档 / 切换场景 / 进出编辑器
#   - 开了高倍时间加速
#   - 场景里飞船很多
# 如果你的机器较慢，或者经常在复杂场景里玩，可以调大一些。
# 调小则能在「游戏没开」时更快报错。
timeout_seconds = 12

# ── 自动播报 ──────────────────────────────────────────────────────
#
# 开启后，只要游戏在跑，插件就会在后台自己读遥测，把最新的飞船状况
# 塞进角色的上下文里。它用的是「只读不打断」的方式：不会突然插话，
# 但主人下次开口时，角色已经知道你现在在哪儿、多高、多快、还有多少燃料。
# 关掉就退回旧的问答式行为：你问了才去读。
auto_brief_enabled = true

# 自动播报的轮询间隔（秒），范围 5-300。
#
# 队列里同一时刻只保留最新一条（coalesce），所以调小不会把上下文撑爆，
# 只是更费一点本机 CPU。爬升和再入阶段参数变化快，间隔太大容易报旧数。
auto_brief_interval_seconds = 20
