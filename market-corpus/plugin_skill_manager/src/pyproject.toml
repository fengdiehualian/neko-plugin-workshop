[project]
name = "plugin_skill_manager"
version = "0.2.0"
description = "N.E.K.O Agent Skills registry: bundled KB/DB skills, user skills-root junction mounting, SKILL.md validation, dynamic entries, call stats"
requires-python = ">=3.11"
# 纯标准库 + 宿主自带 SDK/存储；无第三方依赖。
dependencies = []

[tool.pytest.ini_options]

# 警告一律按错误处理。两个显式豁免（均为宿主/环境所有，非插件缺陷）：
# 1. plugin.settings 的 DeprecationWarning：宿主 SDK 导入链自带
# 2. PytestUnraisableExceptionWarning：Windows Proactor 事件循环 GC 时序，
#    宿主自带 lifekit 套件在本机同样触发（证据见交付说明）
filterwarnings = [
    "error",
    "ignore:plugin.settings.PLUGIN_CONFIG_ROOT:DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

asyncio_mode = "auto"
testpaths = ["tests"]
