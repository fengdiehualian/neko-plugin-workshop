<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>N.E.K.O · 教妹妹开车</title>
  <link rel="stylesheet" href="./panel.css?v=0.1.0-native1">
</head>
<body>
  <main>
    <p class="eyebrow">N.E.K.O · 教妹妹开车</p><h1>准备和猫娘一起开车</h1>
    <p>找到游戏后，点一下安装，模组和所需加载器都会放到正确位置。</p>
    <section aria-labelledby="setup-title">
      <h2 id="setup-title">游戏模组</h2>
      <div class="actions"><button id="detect-game">① 检测游戏</button><button id="install-mod" disabled>② 安装模组</button><button id="uninstall-mod" class="secondary" disabled>卸载模组</button></div>
      <label id="game-choice-label" hidden>选择游戏<select id="game-choice"></select></label>
      <p id="installation-state" role="status">先检测本机 Steam 游戏库，无需填写安装路径。</p>
      <p id="installation-error" role="alert"></p>
      <details><summary>没有找到游戏？</summary><label>游戏目录或游戏程序路径<input id="manual-path" placeholder="选择游戏的安装目录后，将路径粘贴在这里"></label><p>填写后点击「检测游戏」。目前支持 Windows 版《教妹妹开车 Demo》。</p></details>
      <p class="hint">文件已随插件附带，无需编译或额外下载。更新前会备份旧模组；请正常退出游戏后安装。</p>
      <p class="hint">卸载会先备份本插件模组，保留共享加载器、其他模组和游戏存档；请先正常退出游戏。</p>
    </section>
    <section><h2>连接猫娘</h2><p id="takeover-state">点击「检测游戏」确认源码版接管状态；插件需要新版 N.E.K.O。</p><button id="open-drive-panel" disabled>打开接管面板</button>
    </section>
  </main>
  <iframe id="drive-panel" title="教妹妹开车接管面板" allow="microphone; autoplay" hidden></iframe>
  <script type="module" src="./panel.mjs?v=0.1.0-source2"></script>
</body>
</html>
