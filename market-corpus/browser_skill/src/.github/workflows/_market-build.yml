name: BrowserSkill Market Build

on:
  workflow_call:
    inputs:
      plugin-id:
        required: true
        type: string
      neko-repository:
        required: false
        type: string
        default: Project-N-E-K-O/N.E.K.O
      neko-ref:
        required: true
        type: string
      publish:
        required: false
        type: boolean
        default: false

# Permissions are supplied by each caller. Verification callers can stay
# read-only, while the release caller grants contents: write for the GitHub
# Release step below.

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLUGIN_ID: ${{ inputs.plugin-id }}
      NEKO_REPOSITORY: ${{ inputs.neko-repository }}
      NEKO_REF: ${{ inputs.neko-ref }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - name: Validate workflow inputs
        shell: bash
        run: |
          if [[ ! "$PLUGIN_ID" =~ ^[a-z][a-z0-9_]*$ ]]; then
            echo "Invalid plugin id: $PLUGIN_ID" >&2
            exit 1
          fi
          if [[ "$PUBLISH" == "true" && "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Market release requires a tag ref, got ${GITHUB_REF_TYPE}: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          path: plugin-repo

      - name: Fetch pinned BrowserSkill CLI assets
        working-directory: plugin-repo
        run: python3 scripts/fetch_bsk.py

      - name: Checkout N.E.K.O
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NEKO_REPOSITORY }}
          ref: ${{ env.NEKO_REF }}
          path: neko

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff check
        run: >-
          uvx ruff==0.12.4 check --ignore-noqa --isolated
          --target-version py311 --line-length 120
          --select E4,E7,E9,F,I --exclude vendor plugin-repo

      - name: Mount plugin into N.E.K.O tree
        run: |
          rm -rf "neko/plugin/plugins/${PLUGIN_ID}"
          mkdir -p neko/plugin/plugins
          cp -R plugin-repo "neko/plugin/plugins/${PLUGIN_ID}"

      - name: Sync plugin dependencies
        working-directory: neko
        run: uv run --with pip python -m plugin.neko_plugin_cli.cli sync "${PLUGIN_ID}" --clean

      - name: Release check
        working-directory: neko
        shell: bash
        run: |
          set -o pipefail
          mkdir -p plugin/neko_plugin_cli/target
          if [[ "$PUBLISH" == "true" ]]; then
            LOG="plugin/neko_plugin_cli/target/${PLUGIN_ID}.market-release-check.txt"
            uv run python -m plugin.neko_plugin_cli.cli check -r --market-release "${PLUGIN_ID}" | tee "$LOG"
          else
            LOG="plugin/neko_plugin_cli/target/${PLUGIN_ID}.check-release.txt"
            uv run python -m plugin.neko_plugin_cli.cli check -r "${PLUGIN_ID}" | tee "$LOG"
          fi

      - name: Write Market evidence
        working-directory: neko
        shell: bash
        run: |
          PACKAGE="plugin/neko_plugin_cli/target/${PLUGIN_ID}.neko-plugin"
          EVIDENCE="plugin/neko_plugin_cli/target/market-evidence.json"
          test -f "$PACKAGE"
          export PACKAGE_SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          export NEKO_COMMIT="$(git rev-parse HEAD)"
          export EVIDENCE
          python - <<'PY'
          import json
          import os
          import tomllib
          import zipfile
          from pathlib import Path

          plugin_id = os.environ["PLUGIN_ID"]
          package = Path(f"plugin/neko_plugin_cli/target/{plugin_id}.neko-plugin")
          payload_hash = None
          package_version = None
          with zipfile.ZipFile(package) as archive:
              manifest = tomllib.loads(archive.read("manifest.toml").decode("utf-8"))
              package_version = manifest.get("version")
              try:
                  metadata = tomllib.loads(archive.read("metadata.toml").decode("utf-8"))
                  candidate = metadata.get("payload", {}).get("hash")
                  if isinstance(candidate, str):
                      payload_hash = candidate
              except (KeyError, UnicodeDecodeError, tomllib.TOMLDecodeError):
                  pass

          evidence = {
              "schema_version": 1,
              "mode": "release" if os.environ["PUBLISH"] == "true" else "verify",
              "plugin_id": plugin_id,
              "version": package_version,
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "neko_repository": os.environ["NEKO_REPOSITORY"],
              "neko_ref": os.environ["NEKO_REF"],
              "neko_commit": os.environ["NEKO_COMMIT"],
              "package": {
                  "name": f"{plugin_id}.neko-plugin",
                  "sha256": os.environ["PACKAGE_SHA256"],
                  "size": package.stat().st_size,
                  "payload_hash": payload_hash,
              },
          }
          Path(os.environ["EVIDENCE"]).write_text(
              json.dumps(evidence, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Market evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_ID }}-market-evidence
          path: neko/plugin/neko_plugin_cli/target/market-evidence.json

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_ID }}-verification
          path: |
            neko/plugin/neko_plugin_cli/target/${{ env.PLUGIN_ID }}.neko-plugin
            neko/plugin/neko_plugin_cli/target/${{ env.PLUGIN_ID }}.*release-check.txt

      - name: Create GitHub Release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            neko/plugin/neko_plugin_cli/target/${{ env.PLUGIN_ID }}.neko-plugin
            neko/plugin/neko_plugin_cli/target/${{ env.PLUGIN_ID }}.market-release-check.txt
            neko/plugin/neko_plugin_cli/target/market-evidence.json
