[plugin]
name = "卡拉彼丘陪伴"
description = "卡拉彼丘陪伴：随游戏自动启停的本地助手，支持后台加载、面板控制和语音提醒。"
short_description = "随游戏自动启停，在面板中管理陪伴助手与语音提醒。"
keywords = ["calabiyau", "strinova", "卡拉彼丘", "卡拉比丘", "companion"]
version = "0.1.8"
id = "neko_calabiqiu"
entry = "plugin.plugins.neko_calabiqiu:NekoCalabiqiuPlugin"

[plugin.author]
name = "0N.E.K"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "卡拉彼丘陪伴"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = ["state:read", "action:call"]

[plugin_runtime]
enabled = true
auto_start = false

[plugin.store]
enabled = true

[neko_calabiqiu]
# enabled 使用业务默认值，避免与安装 profile 的插件启用开关重复。
dry_run = false
data_layer_url = "http://127.0.0.1:8212"
# 检测到游戏主程序后启动助手，游戏退出后停止；false 保留手动控制模式。
data_layer_auto_start = true
assistant_directory = ""
data_layer_startup_timeout_seconds = 45
data_layer_shutdown_timeout_seconds = 5
data_layer_infer_mode = "auto"
data_layer_infer_backend = "onnx"
data_layer_device = "auto"
# 使用模型文件夹 data_layer/weights/ 下的加密模型（单类别，原始 YOLOv8 转置输出）
data_layer_weights = "data_layer/weights/best-v8-640.nekomodel"
# 推理后端：onnx 为当前唯一运行方案；保留配置项仅为兼容旧配置。
# 推理设备：auto 优先尝试 CUDA 12.8；不兼容或不可用时自动回退 CPU。
# 可填 auto | cpu | cuda | cuda:0
# 无屏模式日志信号源：留空则自动定位（%LOCALAPPDATA%\<Game>\Saved\Logs 最新 .log）
# 例：C:\\Users\\<你的用户名>\\AppData\\Local\\CalabiYau\\Saved\\Logs\\CalabiYau.log
data_layer_log_path = ""
# 画面状态识别：disabled | heuristic | ocr | hybrid | templates
# hybrid 同时使用顶部导航、OCR 和模板。
# ocr 使用插件内置 Tesseract 和中文模型，用户无需另行安装；缺文件时自动降级。
# templates 支持多张同类图片：lobby_*.png/select_*.png/casual_chat_*.png/formal_match_*.png
# 以及 win_*.png/lose_*.png/dead_*.png；配置后仅 formal_match 才启动 YOLO。
# OCR 识别到“已锁定/角色已锁定”或对局内文字（FPS/PING/击败等）时进入 formal_match。
data_layer_classifier = "hybrid"
data_layer_classifier_template_dir = ""
data_layer_classifier_confirm = 3
# OCR 在后台 latest-frame-wins 执行；从完成时刻起冷却 0.5 秒，单次最多 3.0 秒。
data_layer_ocr_interval_seconds = 0.5
data_layer_ocr_timeout_seconds = 3.0
# 第三人称视角下过滤疑似玩家自身角色的检测框（近距离时自身大且位于屏幕下/侧）
# 若误过滤了真实敌人，可改为 false
self_filter_enabled = true
poll_interval_seconds = 0.05
# 数据层内部推理节流（越小识别帧率越高；GPU 上约 25 FPS，CPU 上由算力自动限速）
data_layer_infer_interval_seconds = 0.04
# 仅当推理真正无进展超过此时间才清目标；正常慢帧不会被作废。
data_layer_stale_targets_seconds = 1.5
http_timeout_seconds = 1.5
global_rate_limit_seconds = 6
critical_preempt_cooldown_seconds = 4
output_backpressure_seconds = 6
output_event_max_age_seconds = 8
# 战术方位变化衰减很快；超过此时间仍未获得输出槽就直接丢弃。
vision_output_event_max_age_seconds = 3
safety_auto_stop_enabled = true
safety_window_seconds = 60
safety_failure_limit = 5
require_game_process = true
observability_enabled = false
# 空闲闲聊：视野内无敌人/低威胁且距上次闲聊达该秒数时，猫娘才主动说一句（越小越爱聊）
chatter_min_interval_seconds = 45
# 有敌人（交火/威胁升高）后，安静下来的头 N 秒内不搭话
chatter_fight_cooldown_seconds = 20
