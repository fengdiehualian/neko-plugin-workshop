[project]
name = "n.e.k.o_plugin_mcbot_bridge"
version = "0.1.0"
description = "N.E.K.O mcbot 同伴桥接插件（指挥同伴做事、转达反问、实时转播进展）"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"