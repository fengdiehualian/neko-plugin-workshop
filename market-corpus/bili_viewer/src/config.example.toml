[plugin_runtime]
enabled = true
auto_start = true

# ── B站账号接入（推荐方式：扩展/CDP 运行时自动接入，全程不关闭浏览器）─────
# 优先使用"B站接入桥"扩展（浏览器扩展，随浏览器自动同步登录态，无需任何关闭操作）；
# 插件也支持 CDP 直接连接正在运行的浏览器（Chrome/Edge），读取 B站登录态并绑定：
#   1. 先在浏览器里登录一次 bilibili.com（扫码/账号均可），安装"B站接入桥"扩展后登录态自动同步
#   2. 对 YUI 说"允许你读取浏览器 Cookie 绑定 B站账号"，YUI 会调用 bili_bind_account(allow=true)
#   3. 之后插件启动即自动静默接入（不关闭/不重启浏览器），并持续监控浏览器接入状态
#   4. 若浏览器为普通模式（未开启接入端口）且扩展未安装：无需退出浏览器，安装扩展或
#      打开接入面板一键接入即可，插件会把浏览器以调试模式重新打开（原标签页恢复）并自动完成绑定
# 读取为本地操作，Cookie 不上传、不写日志、不发给 AI。
#
# ── 手动配置（备选）────────────────────────────────────────────
# 也可把浏览器 F12 → Application → Cookies → bilibili.com 复制的整串 Cookie
# 直接填到下方 bili_cookie = "..."（含 SESSDATA；发弹幕/改稿件还需 bili_jct）。
# 手动配置优先级高于自动读取。
[settings]
bili_cookie = ""
# 是否允许插件自动接入浏览器读取 Cookie（true=允许；YUI 询问时回复"允许"即可自动置为 true）
allow_cookie_scan = false
