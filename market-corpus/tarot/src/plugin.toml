[plugin]
id = "tarot"
name = "塔罗牌占卜"
description = "神秘的塔罗牌占卜插件，提供标准塔罗牌、黄金裔塔罗牌（翁法罗斯·逐火之旅）、生辰八字、星座运势等占卜服务。Web UI：http://127.0.0.1:48916/plugin/tarot/ui/"
version = "3.2.0"
entry = "plugins.tarot:TarotReaderPlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = false

[plugin.store]
enabled = true
