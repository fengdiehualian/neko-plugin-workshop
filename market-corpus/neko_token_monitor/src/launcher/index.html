<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>猫粮</title><body style="font:16px system-ui;padding:28px;color:#353b73"><h1>猫粮</h1><p>启动插件后，YUI 会显示在桌面。点击人物旁的 ≡ → 账户设置，即可在猫粮窗口内选择服务商与模型。</p><p>支持 DeepSeek 官方余额、GPT / Claude 组织费用与预算、自定义余额接口和任意模型的手动预算。所有估算都会明确标注喵～</p><p>窗口收起后，可使用插件入口「显示猫粮挂件」重新打开。</p></body></html>
