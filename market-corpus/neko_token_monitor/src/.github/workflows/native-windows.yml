name: Build Windows widget
on:
  workflow_dispatch:
  push:
    paths: ['native/windows/**', 'static/widget.js', '__init__.py', 'recording.py', 'bin/windows/**', 'tests/test_recording.py', 'tests/test_lifecycle_recovery.py', '.github/workflows/native-windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_recording.py tests/test_lifecycle_recovery.py
      - run: dotnet build native/windows/CatFood.csproj -c Release -o out
      - run: python native/windows/smoke.py
      - run: python native/windows/lifecycle_smoke.py
      - run: python native/windows/lifecycle_smoke.py
      - run: python native/windows/artifact.py stamp out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-widget
          path: out/
