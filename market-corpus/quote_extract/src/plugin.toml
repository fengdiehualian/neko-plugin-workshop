[plugin]
id = "quote_extract"
name = "照片语录"
type = "plugin"
description = "抽取照片语录：随机抽一张图发送到聊天，普通款为主，隐藏款小概率掉落（盲盒机制）。图库内置并自动同步，开箱即用，无需任何配置。"
short_description = "Random photo-quote drawer with rare hidden drops."
keywords = ["照片语录", "语录", "抽图", "表情包", "隐藏款", "盲盒", "随机"]
version = "0.1.0"
entry = "plugin.plugins.quote_extract:PhotoQuotePlugin"

[plugin.author]
name = "baixiangyuan"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"
