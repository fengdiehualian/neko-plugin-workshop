# 运行配置模板：N.E.K.O 首次需要运行配置时会把它复制到
#   <用户数据根目录>/plugins/neko_ledger/config/plugin.toml
# 已存在的用户配置不会被这个模板覆盖。

[plugin_runtime]
enabled = true
auto_start = true

[ledger]

# 账本目录；留空 = %LOCALAPPDATA%\N.E.K.O\plugins\neko_ledger
data_dir = ""

# ★ 离谱阈值：超过这个金额就算「花太多」，会触发吐槽
absolute_threshold = 200.0

# ★ 或者：超过同类历史均值的这么多倍，也算离谱
#   （需要至少 min_samples 条同类记录才启用，样本太少判了不准）
category_multiplier = 4.0
min_samples = 3

# 吐槽开关（关掉后离谱也只按日常可爱语气）
snark_enabled = true

# 哈气开关（猫咪 / AI 相关花销的专属语气）
hiss_enabled = true

# ★ 是否尊重人设：读当前猫娘的人设，检测到「不生气 / 温柔」这类设定时，
#   把哈气降级成温和的念叨。关掉则一律按可以哈气处理。
respect_persona = true

# 句尾落款；留空则从内置池随机（喵～ / 喵♪ / 呜喵～）
cat_suffix = ""

# 是否给日常记账配一点表情
emoji = true

# 指定生效的猫娘；留空 = 当前猫娘
catgirl = ""

# 角色卡文件位置；留空 = 自动查找
characters_json = ""
