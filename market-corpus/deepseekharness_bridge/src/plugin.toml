[plugin]
id = "deepseekharness_bridge"
name = "DeepSeek Harness 桥接"
description = "把 DeepSeek Harness (dsh) 的 agent 能力桥接到 N.E.K.O.，让猫娘可以驱动 harness 执行代码、分析资料等长任务。"
short_description = "Drive DeepSeek Harness agents from N.E.K.O."
keywords = ["deepseek", "dsh", "harness", "agent", "代码", "编程", "长任务", "桥接", "bridge"]
version = "0.2.3"
type = "plugin"
entry = "plugin.plugins.deepseekharness_bridge:DeepseekharnessBridgePlugin"

[plugin.author]
name = "N.E.K.O. Community"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = false
timeout = 300
startup_failure = "warn"

[plugin.ui]
enabled = true

# 面板：harness 可用性、配置摘要、最近运行记录，以及一个任务执行表单。
# 权限按最小必要给：state:read 读 @ui.context，action:call 调 @ui.action。
# 不做配置编辑，所以不给 config:write。
[[plugin.ui.panel]]
id = "dashboard"
title = "DeepSeek Harness 桥接"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = ["state:read", "action:call"]

# Plugin-owned business settings. Typed on the Python side by DshSettings;
# these are the runtime-config defaults the host merges over.
[deepseekharness_bridge]
# Absolute path of the DeepSeek Harness checkout used to launch `pnpm dsh`.
# Leave empty to resolve `dsh` from PATH.
repo_path = ""
# Explicit `dsh` executable. Empty means "look on PATH".
dsh_executable = ""
# Profile passed to `dsh`.
# `headless` is the right default for a desktop install: it runs a one-shot
# task without a web server. `desktop` is owned exclusively by the Electron
# app and cannot be launched from the CLI, so it is never valid here.
profile = "headless"
# Which credential route the harness uses.
#   deepseek-account    — reuse the DeepSeek sign-in already in DSH; no API key
#                         needed, and the live /models listing is fetched
#   deepseek-official   — the API-key route (DEEPSEEK_API_KEY)
# The default re-enables the account stack that headless disables by design.
provider = "deepseek-account"
# Model id handed to the harness on each run. Must be one the running DSH
# knows: deepseek-flash (V4.1-Flash) or deepseek-v4-pro. The panel's model
# dropdown writes this, so it normally does not need editing by hand.
model = "deepseek-flash"
# How much the model thinks before answering: off / low / high / max. (DSH's
# Messages path accepts only these four — minimal and medium are rejected.) Higher
# spends more thinking tokens — slower and costlier, often better. The panel
# exposes this; the CLI has no flag for it.
reasoning_effort = "max"
# What the harness may write: read-only / workspace-write / danger-full-access.
# read-only is honoured verbatim (the bridge declares it as a real preset), so
# picking it genuinely confines the harness. workspace-write is the default
# because most tasks need to create or edit files; danger-full-access lifts the
# boundary entirely.
sandbox_mode = "workspace-write"
# Hard ceiling for a single harness run, in seconds. DSH tasks are long by
# nature, so this is deliberately generous.
task_timeout = 600
# Working directory the harness operates on, and the root the
# `workspace-write` sandbox allows. Empty means the plugin's own storage
# directory, so a task can only touch files inside it.
workspace = ""
# Directory where run logs and artifacts are written.
log_dir = ""
