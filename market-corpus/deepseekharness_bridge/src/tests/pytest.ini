# tests/ 自己的 pytest 配置。
#
# 放在这里而不是插件根的 pyproject.toml，是为了让 pytest 的 rootdir 落在
# tests/ 自身：rootdir 决定 basedir，basedir 决定 prepend 模式往 sys.path 插
# 哪个目录。rootdir 若是插件根，pytest 会顺着目录结构把入口 __init__.py 当
# 父包导入，而它依赖 plugin.sdk，在 CI 里不存在。
[pytest]
testpaths = .
python_files = test_*.py
addopts = -q --import-mode=importlib -p no:cacheprovider
