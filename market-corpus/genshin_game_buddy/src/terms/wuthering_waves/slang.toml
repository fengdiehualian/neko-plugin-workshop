# =============================================================================
# terms/wuthering_waves/slang.toml —— 鸣潮 · 玩家黑话
# -----------------------------------------------------------------------------
# 黑话是最影响"像不像圈内人"的一层，也是语境块会少量携带的一层。
#
# ⚠️⚠️ TODO(verify) 【高优先级】: 本文件是**刻意留空的模板**。
#     我不对鸣潮社区黑话作任何断言——凭空编造黑话比留空更有害，
#     因为它会让猫娘说出圈内人一眼看出是假的词。
#     请由真正在玩鸣潮的同事补全。
#
# 补全建议（按优先级）：
#   1. 玩家对高层挑战玩法的俗称（如对"逆境深塔"一类的叫法）
#   2. 抽卡相关的运气用语（对齐原神那份的「欧/非/歪了」结构）
#   3. 对声骸词条好坏的说法
#   4. 版本/活动相关的口头语
#
# schema（与原神那份完全一致）：
#   [terms."<词>"]
#   kind    = "黑话"          必填
#   brief   = "<≤80 字解释>"   必填
#   aliases = []              可选
#   slang   = []              可选
#   avoid   = ""              可选：常见误用
# =============================================================================

# -----------------------------------------------------------------------------
# 示例结构（补全时取消注释并填写；不要保留空 brief）
# -----------------------------------------------------------------------------
# [terms."<挑战玩法俗称>"]
# kind    = "黑话"
# brief   = "TODO(verify): 对某高层挑战玩法的俗称，请确认正式名称与当前版本状态"
# aliases = []
# slang   = []
#
# [terms."<运气用语>"]
# kind    = "黑话"
# brief   = "TODO(verify): 对应原神的「欧/非」，请填写鸣潮社区的实际说法"
#
# [terms."<声骸词条用语>"]
# kind    = "黑话"
# brief   = "TODO(verify): 玩家对声骸词条好坏的评价用语"

# NOTE: 本文件在补全前只含 [game] 之外的空内容，term_store 必须能正确处理
#       "某个维度文件里没有任何 [terms.*]" 这一情况（见测试清单 B-08）。
