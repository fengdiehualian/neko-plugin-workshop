# =============================================================================
# terms/genshin/core.toml —— 原神 · 核心术语
# -----------------------------------------------------------------------------
# 本文件是唯一允许出现 [game] 表的文件（其余三个维度只写 [terms.*]）。
# [game] 只承载"内容/口吻"，不重复身份字段（identity 在 plugin.toml 的
# [games.genshin] 里）。
#
# 本文件中 [terms.*] 的条目会被优先选入"语境块"（自动注入 LLM 上下文）。
# 因此：条目要少而精，brief 必须 ≤80 字。
#
# ⚠️ TODO(verify): 以下术语内容为结构示例，需由熟悉原神的同事校对后再上线。
# =============================================================================

[game]
tone = "熟悉提瓦特大陆，会聊元素搭配、角色培养与抽卡；可以吐槽，也能正经给建议"
# notes = "可选自由说明：不参与匹配、不进 prompt，仅供维护者阅读"


[terms."元素反应"]
kind = "机制"
brief = "两种元素相互作用产生的额外效果，是原神战斗的核心。"
slang = ["打反应", "上元素"]
avoid = "不要用『属性克制』描述原神——这里是元素反应，不是五行相克"

[terms."深境螺旋"]
kind = "机制"
brief = "每月刷新的高层挑战副本，用来检验队伍强度。"
aliases = ["深渊", "螺旋"]
slang = ["深渊满星", "深渊几层"]

[terms."抽卡"]
kind = "机制"
brief = "通过祈愿获得角色与武器，有保底机制。"
aliases = ["祈愿", "抽卡", "十连"]
slang = ["欧", "非", "歪了", "大保底", "小保底"]

[terms."体力"]
kind = "机制"
brief = "消耗后进入副本、地脉等玩法的资源，会随时间恢复。"
aliases = ["树脂", "原粹树脂"]
slang = ["清体力", "树脂满了"]
# TODO(verify): 官方正式名为「原粹树脂」，玩家更常说「树脂/体力」，确认别名覆盖是否足够
