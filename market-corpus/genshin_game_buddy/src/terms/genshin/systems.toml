# =============================================================================
# terms/genshin/systems.toml —— 原神 · 机制与系统
# -----------------------------------------------------------------------------
# 不进语境块，按需查询。只写 [terms.*]，不得出现 [game] 表。
#
# 来源说明：miao-plugin 的 meta-gs 索引里没有元素反应/机制这类数据
#   （artifact/data.json 只有套装名与 2/4 件套效果文本），因此本文件是人工撰写。
#   每条都只写「是什么」，不写数值口径；未定的表述以行内 TODO 注记标出。
# =============================================================================

# 人工撰写：这 15 条机制不在 miao-plugin 索引里（索引只有角色/武器/圣遗物表）

[terms."蒸发"]
kind = "机制"
brief = "火元素与水元素反应，按触发顺序提升本次伤害倍率。"
slang = ["打蒸发"]

[terms."融化"]
kind = "机制"
brief = "火元素与冰元素反应，按触发顺序提升本次伤害倍率。"
slang = ["打融化"]

[terms."感电"]
kind = "机制"
brief = "雷元素与水元素反应，造成持续雷元素伤害，对群有效。"
slang = ["打感电"]

[terms."超载"]
kind = "机制"
brief = "火元素与雷元素反应，造成范围火元素伤害并把敌人击退。"

[terms."冻结"]
kind = "机制"
brief = "水元素与冰元素反应，使敌人无法行动。"

[terms."超导"]
kind = "机制"
brief = "冰元素与雷元素反应，造成冰元素伤害并降低敌人物理抗性。"

[terms."扩散"]
kind = "机制"
brief = "风元素接触其他元素后，把该元素扩散到周围的目标。"

[terms."结晶"]
kind = "机制"
brief = "岩元素接触其他元素后，生成可拾取的元素结晶护盾。"

[terms."绽放"]
kind = "机制"
brief = "草元素与水元素反应，生成草原核，引爆后造成范围伤害。"

[terms."激化"]
kind = "机制"
brief = "草元素与雷元素反应产生的强化状态，提升随后雷／草元素伤害。"
# TODO(verify): 超激化／蔓激化的准确表述

[terms."圣遗物"]
kind = "机制"
brief = "角色的主要属性来源，由主词条与副词条构成。"
slang = ["词条", "歪了", "双爆"]
# TODO(verify): 强化机制与「歪词条」的准确说法

[terms."命之座"]
kind = "机制"
brief = "重复获得同一角色后提升的进阶层数。"
aliases = ["命座"]
slang = ["满命", "几命"]

[terms."纪行"]
kind = "机制"
brief = "按版本周期推进的通行证玩法。"
aliases = ["通行证", "大月卡"]
# TODO(verify): 与正式名称及免费／付费层的区分

[terms."元素能量"]
kind = "机制"
brief = "释放元素爆发所需的能量，由元素微粒与元素晶球回复。"
aliases = ["充能", "元素充能"]
# TODO(verify): 「元素能量」与「元素充能效率」是两个东西，确认别名不混淆

[terms."秘境"]
kind = "机制"
brief = "消耗体力进入的副本，用于获取圣遗物、天赋书与武器突破材料。"
