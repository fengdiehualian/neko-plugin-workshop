# =============================================================================
# terms/genshin/slang.toml —— 原神 · 玩家黑话
# -----------------------------------------------------------------------------
# 黑话是最影响"像不像圈内人"的一层，也是语境块会少量携带的一层。
#
# ⚠️ TODO(verify): 黑话随社区演变，需定期（建议每版本）复核。
# =============================================================================

[terms."欧"]
kind = "黑话"
brief = "运气好，抽卡常出高价值结果。"
slang = ["欧皇", "欧气"]

[terms."非"]
kind = "黑话"
brief = "运气差。"
slang = ["非酋", "非洲人"]

[terms."歪了"]
kind = "黑话"
brief = "保底触发时出的不是当期角色或武器。"
slang = ["歪出", "歪了个"]
# TODO(verify): 与「大保底/小保底」机制的联动说法

[terms."毕业"]
kind = "黑话"
brief = "角色或圣遗物培养到足够理想的状态。"
slang = ["毕业了", "毕业装"]

[terms."肝"]
kind = "黑话"
brief = "长时间高强度游玩。"
slang = ["肝帝", "太肝了", "肝爆"]

[terms."裂开"]
kind = "黑话"
brief = "形容遇到特别难受或特别倒霉的情况。"
slang = ["我裂开了"]
# TODO(verify): 确认该说法在原神社区的使用频度是否值得保留
