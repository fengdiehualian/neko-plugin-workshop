[plugin]
name = "Suno.cn 音乐生成"
description = "通过 Suno.cn API 生成 AI 音乐、查询任务、获取歌词等功能"
version = "1.0.0"
id = "suno_cn_music"
entry = "plugin.plugins.suno_cn_music:SunoCnMusicPlugin"

[plugin.author]
name = "ZhaiJiu"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = false

[plugin.store]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "快速开始"
entry = "README.md"
permissions = ["state:read"]

[suno]
api_key = ""
base_url = "https://mcp.suno.cn"
timeout_seconds = 60
