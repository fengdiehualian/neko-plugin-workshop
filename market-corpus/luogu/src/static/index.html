<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>洛谷</title>
  <style>
    :root { --bg:#12161f; --card:#1b2230; --text:#e6e9ef; --muted:#7f8a9b; --accent:#5b9dff; --ok:#3fbf7f; --bad:#e05a5a; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; background:var(--bg); color:var(--text); font:14px/1.6 system-ui,"Segoe UI","Microsoft YaHei",sans-serif; }
    .container { max-width:720px; margin:0 auto; }
    h1 { font-size:22px; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 22px; font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:16px; }
    .card { background:var(--card); border:1px solid #2a3345; border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:8px; text-decoration:none; color:inherit; transition:.15s; cursor:pointer; }
    a.card:hover { border-color:var(--accent); transform:translateY(-2px); }
    .card .icon { font-size:32px; line-height:1; }
    .card h2 { font-size:16px; margin:0; }
    .card p { font-size:12px; color:var(--muted); margin:0; }
    .badge { align-self:flex-start; padding:2px 10px; border-radius:999px; font-size:12px; margin-top:auto; }
    .badge.ok { background:rgba(63,191,127,.15); color:var(--ok); }
    .badge.no { background:rgba(224,90,90,.15); color:var(--bad); }
    .panel { background:var(--card); border:1px solid #2a3345; border-radius:12px; padding:16px; margin-top:16px; }
    .panel h3 { margin:0 0 8px; font-size:14px; }
    .hint { color:var(--muted); font-size:12px; margin:0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>洛谷</h1>
    <p class="sub">个性化刷题成长助手 · 成为OIer吧！</p>

    <div class="grid">
      <a class="card" href="config.html" id="cred-card">
        <div class="icon">🔑</div>
        <h2>登录凭据</h2>
        <p>配置洛谷登录 Cookie，启用提交记录 / 成长报告 / 每日题单。</p>
      </a>
      <div class="card">
        <div class="icon">📖</div>
        <h2>功能一览</h2>
        <p>对各 AI 说：解题思路提示、成长报告、每日题单、搜索洛谷题目、题目详情、比赛列表、用户资料、提交记录。</p>
      </div>
    </div>

    <div class="panel">
      <h3>说明</h3>
      <p class="hint">登录态用于提交记录分析、成长报告与每日题单；不登录也能搜题、看详情、查比赛与公开用户资料。配置入口见「登录凭据」。</p>
    </div>
  </div>

  <script>
    (function () {
      "use strict";
      var m = (location.pathname || "").match(/^(\/plugin\/[^\/]+)/);
      var base = m ? m[1] : "/plugin/luogu";
      fetch(base + "/hosted-ui/context?kind=panel&id=main")
        .then(function (r) { return r.json(); })
        .then(function (ctx) {
          var state = (ctx && ctx.state) || ctx || {};
        });
    })();
  </script>
</body>
</html>
