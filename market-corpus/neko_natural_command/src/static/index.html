<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自然语言命令 · 管理面板</title>
<style>
/* 自托管字体（只有拉丁与数字，中文走系统字体栈） */
@font-face{font-family:'Quicksand';src:url("fonts/quicksand-500.woff2") format("woff2");font-weight:400 600;font-display:swap}
@font-face{font-family:'Lora';src:url("fonts/lora-500.woff2") format("woff2");font-weight:400 600;font-display:swap}
@font-face{font-family:'JBMono';src:url("fonts/jetbrains-mono-400.woff2") format("woff2");font-weight:400 600;font-display:swap}

:root{
  --ink:#2b2640; --ink2:#585070; --dim:#8d86a8;
  --glass:rgba(255,255,255,.72); --line:rgba(255,255,255,.85); --edge:rgba(122,110,175,.20);
  --accent:#7c6cf0; --accent-lt:#a99cf8;
  --ok:#2c9d72; --bad:#d24f6d; --warn:#b8811f;
  --shadow:0 10px 28px rgba(58,48,110,.13);
  --font-ui:'Quicksand',system-ui,'Microsoft YaHei','PingFang SC',sans-serif;
  --font-body:'Quicksand',system-ui,'Microsoft YaHei','PingFang SC',sans-serif;
  --font-mono:'JBMono',ui-monospace,Consolas,'Microsoft YaHei',monospace;
  --fs:14px;
  /* 字号全部由 --fs 派生，换档位才是整页缩放 */
  --fs-2xs:calc(var(--fs) * .82); --fs-xs:calc(var(--fs) * .86);
  --fs-sm:calc(var(--fs) * .89);  --fs-base:calc(var(--fs) * .92);
  --fs-in:calc(var(--fs) * .93);  --fs-md:calc(var(--fs) * .96);
  --fs-lg:calc(var(--fs) * 1.04); --fs-xl:calc(var(--fs) * 1.36);
  --fs-h1:calc(var(--fs) * 1.43);
  --bg-stack:
    linear-gradient(180deg,rgba(255,255,255,.36) 0%,rgba(255,255,255,.62) 45%,rgba(253,251,255,.78) 100%),
    url("bg.jpg") center top / cover no-repeat fixed,
    linear-gradient(160deg,#e8f3ff,#f6f1ff 55%,#eafaf6);
}
*{box-sizing:border-box}
/* 页签与面板靠它切换：没有这条规则，四个页签会全部铺开，
   点导航看起来"毫无反应"（其实是 display 没变） */
.hidden{display:none !important}

body{margin:0;color:var(--ink);font-family:var(--font-body);font-size:var(--fs);line-height:1.7;background:var(--bg-stack)}
.app{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
#trail-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
#trail-canvas.off{display:none}

/* 顶栏 */
.topbar{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:14px}
.mark{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;
  background:linear-gradient(160deg,#6fb9f7,#7c6cf0);color:#fff;box-shadow:0 8px 20px rgba(90,120,232,.32)}
.mark svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-family:var(--font-ui);font-size:var(--fs-h1);margin:0;letter-spacing:.3px}
.sub{color:var(--ink2);font-size:var(--fs-sm);margin-top:2px}
.pill{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--glass);
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:var(--fs-sm);
  color:var(--ink2);box-shadow:var(--shadow);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#c6c0dc;flex:none}
.dot.on{background:#3dbd8b;box-shadow:0 0 0 4px rgba(61,189,139,.2)}
.dot.off{background:#e0778e;box-shadow:0 0 0 4px rgba(224,119,142,.2)}

/* 布局 */
.layout{display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;align-items:start}
.rail{position:sticky;top:16px;display:flex;flex-direction:column;gap:4px;padding:8px;
  background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 6px;border-radius:16px;
  border:1px solid transparent;background:transparent;color:var(--ink2);font-size:var(--fs-2xs);
  font-family:inherit;cursor:pointer;transition:.16s}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{background:rgba(255,255,255,.62);color:var(--ink)}
.tab.on{background:linear-gradient(180deg,#9184f6,#7c6cf0);color:#fff;box-shadow:0 8px 18px rgba(124,108,240,.36)}
.content{min-width:0}

/* 卡片 */
.card{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{display:flex;align-items:center;gap:9px;font-family:var(--font-ui);font-size:var(--fs-lg);
  margin:0 0 13px;color:#40375f;font-weight:600}
.card h2::before{content:"";width:4px;height:15px;border-radius:3px;flex:none;
  background:linear-gradient(180deg,var(--accent),var(--accent-lt))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px}
label{display:block;font-size:var(--fs-xs);color:var(--dim);margin-bottom:5px;font-weight:500}
input,select{background:rgba(255,255,255,.86);color:var(--ink);border:1px solid var(--edge);
  border-radius:11px;padding:8px 11px;font-size:var(--fs-in);font-family:inherit;transition:.15s}
input:focus,select:focus{outline:none;border-color:var(--accent-lt);box-shadow:0 0 0 3px rgba(124,108,240,.16)}
button{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#8b7cf2,#7365e6);
  color:#fff;border:0;border-radius:11px;padding:8px 17px;font-size:var(--fs-in);font-family:inherit;
  cursor:pointer;box-shadow:0 6px 16px rgba(115,101,230,.28);transition:.15s}
button:hover{filter:brightness(1.06);transform:translateY(-1px)}
button.ghost{background:rgba(255,255,255,.7);color:var(--ink2);border:1px solid var(--edge);box-shadow:none}
button.ghost:hover{color:var(--accent);border-color:var(--accent-lt);filter:none}
button.tiny{padding:2px 10px;font-size:var(--fs-2xs);box-shadow:none}
:focus-visible{outline:2px solid var(--accent-lt);outline-offset:2px;border-radius:9px}

/* 统计与胶囊 */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.stat{background:rgba(255,255,255,.66);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--font-ui);font-size:var(--fs-xl);color:#40375f;line-height:1.25}
.stat span{font-size:var(--fs-2xs);color:var(--dim)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:var(--fs-xs);margin:2px 4px 2px 0;white-space:nowrap}
.badge.on{background:rgba(61,189,139,.18);color:var(--ok)}
.badge.off{background:rgba(224,119,142,.16);color:var(--bad)}
.badge.info{background:rgba(124,108,240,.14);color:#6558c9}
.badge.warn{background:rgba(224,177,85,.22);color:var(--warn)}
.notice{background:rgba(255,244,219,.85);border-left:3px solid #e0b155;color:#71521a;
  padding:11px 14px;border-radius:0 12px 12px 0;font-size:var(--fs-sm);margin-bottom:13px}
.notice.bad{background:rgba(255,235,239,.9);border-left-color:#dd6a86;color:#7d2740}
.muted{color:var(--dim);font-size:var(--fs-sm)}
.muted code{background:rgba(255,255,255,.7);border:1px solid var(--edge);border-radius:6px;
  padding:1px 6px;font-size:var(--fs-xs);font-family:var(--font-mono)}
.status{margin-left:8px;font-size:var(--fs-xs);color:var(--dim);display:inline-flex;align-items:center;gap:2px}
.spin{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;margin-right:5px;
  border:2px solid rgba(124,108,240,.3);border-top-color:var(--accent);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 列表项 */
.items{display:flex;flex-direction:column;gap:8px}
.item{background:rgba(255,255,255,.66);border:1px solid var(--line);border-radius:13px;padding:9px 12px}
.item .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .name{font-family:var(--font-ui);font-size:var(--fs-md);color:#3f3859;font-weight:600}
.item .cid{font-family:var(--font-mono);font-size:var(--fs-xs);color:#5b5375;
  background:rgba(124,108,240,.1);border-radius:6px;padding:1px 7px;word-break:break-all}
.item .desc{color:var(--ink2);font-size:var(--fs-sm);margin-top:3px}
.item .copy{margin-left:auto}
.empty{border-style:dashed;text-align:center;color:var(--dim);font-size:var(--fs-sm);padding:22px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
  background:rgba(255,255,255,.7);border:1px solid var(--edge);border-radius:10px;padding:5px 12px;
  font-size:var(--fs-sm);color:var(--ink2)}
.switch .knob{width:30px;height:16px;border-radius:9px;background:#d6d0ea;position:relative;transition:.18s;flex:none}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.18s}
.switch.on .knob{background:linear-gradient(90deg,#8f80f5,#6f5ee8)}
.switch.on .knob::after{left:16px}
.switch.on{border-color:var(--accent-lt);color:var(--accent)}
*{scrollbar-width:thin;scrollbar-color:rgba(124,108,240,.32) transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(124,108,240,.3);border-radius:6px;border:2px solid transparent;background-clip:content-box}

.expfloat{position:fixed;z-index:99;pointer-events:none;font-family:var(--font-ui);font-weight:600;
  color:#6f5ee8;text-shadow:0 1px 0 #fff,0 0 14px rgba(124,108,240,.55);animation:floatUp 1.1s ease forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.9)}20%{opacity:1;transform:translate(-50%,-12px)}
  100%{opacity:0;transform:translate(-50%,-66px)}}

@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;flex-direction:row;overflow-x:auto;border-radius:18px}
  .tab{min-width:74px}
  .pill{margin-left:0}
}
</style>
</head>
<body>
<canvas id="trail-canvas" aria-hidden="true"></canvas>
<div class="app">

  <div class="topbar">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 6.5h6.2l1.8 2.2 1.8-2.2H20V18H4z"/><path d="M8 21l1.6-3M16 21l-1.6-3"/></svg>
    </div>
    <div>
      <h1>自然语言命令</h1>
      <div class="sub">说人话触发命令：先在命令库语义匹配，没命中就当场自学会并长期保存</div>
    </div>
    <div class="pill" id="status-pill">
      <span class="dot" id="pill-dot"></span><span id="pill-text">正在连接面板…</span>
    </div>
  </div>

  <div class="layout">
    <nav class="rail">
      <button class="tab on" data-tab="overview">
        <svg viewBox="0 0 24 24"><path d="M4 13h4v7H4zM10 8h4v12h-4zM16 4h4v16h-4z"/></svg><span>概览</span>
      </button>
      <button class="tab" data-tab="commands">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h13"/><circle cx="18" cy="17" r="2.4"/></svg><span>命令库</span>
      </button>
      <button class="tab" data-tab="entries">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="7" height="7" rx="2"/><rect x="13.5" y="4.5" width="7" height="7" rx="2"/>
          <rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>能力</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.5 1.5M16.2 16.2l1.5 1.5M17.7 6.3l-1.5 1.5M7.8 16.2l-1.5 1.5"/></svg><span>设置</span>
      </button>
    </nav>

    <main class="content">

      <!-- 概览 -->
      <div id="tab-overview">
        <div id="warn-box"></div>
        <div class="card">
          <h2>运行状态</h2>
          <div class="stats" id="stat-box"></div>
          <div class="row">
            <span class="badge info" id="b-model">模型：—</span>
            <span class="badge info" id="b-perm">权限：—</span>
            <span class="badge info" id="b-port">端口：—</span>
            <span class="status" id="st-overview"></span>
          </div>
        </div>
        <div class="card">
          <h2>已安装插件</h2>
          <div id="plugin-list" class="items"></div>
        </div>
      </div>

      <!-- 命令库 -->
      <div id="tab-commands" class="hidden">
        <div class="card">
          <h2>命令库（<span id="cmd-count">0</span> 条）</h2>
          <div class="row" style="margin-top:0">
            <input id="cmd-search" placeholder="搜索：名称 / id / 描述" style="min-width:240px">
            <select id="cmd-type"><option value="">全部类型</option></select>
            <select id="cmd-perm">
              <option value="">全部权限</option>
              <option value="user">普通</option>
              <option value="admin">需提权</option>
            </select>
            <button class="ghost tiny" id="cmd-reset">重置</button>
            <span class="muted" id="cmd-hint"></span>
          </div>
          <div class="items" id="cmd-list" style="margin-top:12px"></div>
        </div>
      </div>

      <!-- 能力 -->
      <div id="tab-entries" class="hidden">
        <div class="card">
          <h2>可调用的插件能力（<span id="entry-count">0</span> 个）</h2>
          <div class="muted" style="margin-bottom:10px">
            这些是当前所有插件暴露的入口，自然语言命中后就会调用它们。复制 id 可直接在别的插件/配置里引用。
          </div>
          <div class="row" style="margin-top:0">
            <input id="entry-search" placeholder="搜索：entry id / 说明" style="min-width:240px">
          </div>
          <div class="items" id="entry-list" style="margin-top:12px"></div>
        </div>
      </div>

      <!-- 设置 -->
      <div id="tab-settings" class="hidden">
        <div class="card">
          <h2>命令行为</h2>
          <div class="row" style="margin-top:0">
            <div class="switch" id="auto-switch" role="button" tabindex="0">
              <span class="knob"></span><span id="auto-label">自动学新命令</span>
            </div>
            <button class="ghost" id="btn-reload">重载命令库 + 能力表</button>
            <span class="status" id="st-settings"></span>
          </div>
          <div class="muted" style="margin-top:9px">
            开启后：说一句没匹配到的需求，会当场生成一条新命令并保存到
            <code>data/commands.json</code>，下次就能直接命中。关掉则只回「没学过」。
          </div>
        </div>
        <div class="card">
          <h2>界面</h2>
          <div class="grid">
            <div><label>字体</label><select id="ui-font"></select></div>
            <div><label>字号</label>
              <select id="ui-size">
                <option value="s">小</option><option value="m">标准</option>
                <option value="l">大</option><option value="xl">特大</option>
              </select>
            </div>
            <div><label>鼠标轨迹</label>
              <select id="ui-trail"><option value="auto">自动</option><option value="on">开</option><option value="off">关</option></select>
            </div>
            <div><label>背景</label>
              <select id="ui-bg">
                <option value="default">插件自带</option>
                <option value="custom">我上传的图</option>
                <option value="plain">纯色渐变（不要图）</option>
              </select>
            </div>
            <div><label>蒙层</label>
              <select id="ui-bg-dim"><option value="light">薄</option><option value="medium">中</option><option value="strong">厚</option></select>
            </div>
          </div>
          <div class="row">
            <button class="ghost" id="btn-bg-upload">换背景图</button>
            <button class="ghost" id="btn-bg-reset">恢复默认</button>
            <input type="file" id="bg-file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none">
            <span class="muted" id="bg-note"></span>
          </div>
          <div class="muted" style="margin-top:9px">
            背景图存在本机的 <code>data/backgrounds/</code>，<b>不进安装包</b>；字看不清就把蒙层调厚。
          </div>
        </div>
        <div class="card">
          <h2>安全与模型</h2>
          <div id="safety-box" class="items"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// ── 面板寻址：插件的面板端口，或宿主同源代理 ────────────────────
const PORTS = [15680, 15681, 15682, 15683, 15684];
let API_BASE = localStorage.getItem('nc_panel_base');
async function findBase(){
  if (API_BASE !== null && API_BASE !== undefined) return API_BASE;
  const q = Number(new URLSearchParams(location.search).get('port') || 0);
  const candidates = ['', ...(q ? [q] : PORTS).map((p) => `http://127.0.0.1:${p}`)];
  for (const base of candidates){
    try{
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 1200);
      const res = await fetch(`${base}/api/status`, {signal: ctrl.signal});
      clearTimeout(timer);
      if (!res.ok) continue;
      const data = await res.json();
      if (data && (data.command_count !== undefined || data.auto_create !== undefined)){
        API_BASE = base;
        localStorage.setItem('nc_panel_base', base);
        return base;
      }
    }catch(err){ /* 下一个候选 */ }
  }
  return null;
}
async function api(path, body){
  const base = await findBase();
  if (base === null){
    const err = new Error('连不上面板服务：确认插件已启动，或稍等几秒再刷新');
    err.noService = true;
    throw err;
  }
  const res = await fetch(base + path, body === undefined
    ? {method: 'GET'}
    : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  return await res.json();
}
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const busy = (el, text) => { el.innerHTML = `<span class="spin"></span>${esc(text || '处理中...')}`; el.style.color = 'var(--ink2)'; };
const statusOf = (el, ok, msg) => {
  el.textContent = msg || (ok ? '完成' : '失败');
  el.style.color = ok ? 'var(--ok)' : 'var(--bad)';
};
function floatText(text, at){
  const node = document.createElement('div');
  node.className = 'expfloat';
  node.textContent = text;
  node.style.left = `${(at && at.x) || window.innerWidth - 120}px`;
  node.style.top = `${(at && at.y) || 100}px`;
  node.style.fontSize = 'var(--fs-sm)';
  document.body.appendChild(node);
  setTimeout(() => node.remove(), 1200);
}

// ── 鼠标轨迹（很轻的实现，不动鼠标就停帧）──────────────────────
const trail = (() => {
  const canvas = $('trail-canvas');
  const ctx = canvas.getContext('2d');
  let points = [];
  let raf = 0;
  let dpr = 1;
  function resize(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function push(x, y){
    points.push({x, y, t: performance.now()});
    if (points.length > 36) points = points.slice(-36);
    if (!raf) raf = requestAnimationFrame(draw);
  }
  function draw(){
    const now = performance.now();
    points = points.filter((p) => now - p.t < 520);
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if (points.length < 2){ points = []; raf = 0; return; }
    for (let i = 1; i < points.length; i++){
      const a = points[i - 1], b = points[i];
      const power = 1 - (now - b.t) / 520;
      const ratio = i / points.length;
      ctx.strokeStyle = `hsla(${210 + ratio * 60}, ${70 - (1 - power) * 20}%, ${60 + ratio * 6}%, ${0.5 * power})`;
      ctx.lineWidth = 1.8 + 8 * power * ratio;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    // 头部加一点光晕，像笔尖，比纯线条显眼
    const head = points[points.length - 1];
    const glow = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 18);
    glow.addColorStop(0, 'rgba(124,108,240,.4)');
    glow.addColorStop(1, 'rgba(124,108,240,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(head.x, head.y, 18, 0, Math.PI * 2);
    ctx.fill();
    raf = requestAnimationFrame(draw);
  }
  function enable(on){
    canvas.classList.toggle('off', !on);
    if (!on){
      points = [];
      if (raf){ cancelAnimationFrame(raf); raf = 0; }
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }
  }
  document.addEventListener('pointermove', (ev) => {
    if (!canvas.classList.contains('off')) push(ev.clientX, ev.clientY);
  }, {passive: true});
  window.addEventListener('resize', resize);
  resize();
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  return {enable, reduced: reduce};
})();

// ── 界面偏好（字体 / 字号 / 轨迹）────────────────────────────
const FONTS = [
  {id: 'system', name: '系统默认', ui: `'Quicksand',system-ui,'Microsoft YaHei','PingFang SC',sans-serif`, mono: `'JBMono',Consolas,monospace`},
  {id: 'yahei', name: '微软雅黑 / 苹方', ui: `'Quicksand','Microsoft YaHei','PingFang SC',sans-serif`, mono: `'JBMono',Consolas,'Microsoft YaHei',monospace`},
  {id: 'source', name: '思源黑体 / Noto', ui: `'Quicksand','Source Han Sans SC','Noto Sans SC','HarmonyOS Sans SC','MiSans','Microsoft YaHei',sans-serif`, mono: `'JBMono','Sarasa Mono SC',Consolas,monospace`},
  {id: 'wenkai', name: '霞鹜文楷（文书感）', ui: `'Lora','LXGW WenKai','霞鹜文楷',STKaiti,'Songti SC',serif`, mono: `'JBMono','Sarasa Mono SC',Consolas,serif`},
  {id: 'rounded', name: '圆体（可爱）', ui: `'Quicksand',YouYuan,'幼圆','Yuanti SC','Microsoft YaHei',sans-serif`, mono: `'JBMono',Consolas,monospace`},
  {id: 'mono', name: '等宽 / 代码', ui: `'JBMono','Cascadia Mono',Consolas,'Microsoft YaHei',monospace`, mono: `'JBMono',Consolas,monospace`},
];
const SIZES = {s: '12.5px', m: '14px', l: '15.5px', xl: '17px'};
let PREFS = {ui_font: 'system', ui_font_size: 'm', ui_trail: 'on'};

function applyPrefs(){
  const font = FONTS.find((f) => f.id === PREFS.ui_font) || FONTS[0];
  const root = document.documentElement.style;
  root.setProperty('--font-ui', font.ui);
  root.setProperty('--font-body', font.ui);
  root.setProperty('--font-mono', font.mono);
  root.setProperty('--fs', SIZES[PREFS.ui_font_size] || SIZES.m);
  $('ui-font').value = font.id;
  $('ui-size').value = SIZES[PREFS.ui_font_size] ? PREFS.ui_font_size : 'm';
  $('ui-trail').value = ['auto', 'on', 'off'].includes(PREFS.ui_trail) ? PREFS.ui_trail : 'on';
  const want = PREFS.ui_trail === 'on' ? true : (PREFS.ui_trail === 'off' ? false : !trail.reduced);
  trail.enable(want);
}
$('ui-font').innerHTML = FONTS.map((f) => `<option value="${f.id}">${f.name}</option>`).join('');
applyPrefs();

async function savePrefs(){
  try { await api('/api/panel_prefs', PREFS); }
  catch (err){ statusOf($('st-settings'), false, String(err)); }
}

// ── 背景：插件自带 / 我上传的图 / 纯色渐变，整栈由一个变量重建 ──────
const BG_DIM = {
  light:  'rgba(255,255,255,.26) 0%,rgba(255,255,255,.44) 45%,rgba(253,251,255,.60) 100%',
  medium: 'rgba(255,255,255,.34) 0%,rgba(255,255,255,.58) 45%,rgba(253,251,255,.74) 100%',
  strong: 'rgba(255,255,255,.52) 0%,rgba(255,255,255,.72) 45%,rgba(253,251,255,.86) 100%',
};
const BG_FALLBACK = 'linear-gradient(160deg,#e8f3ff,#f6f1ff 55%,#eafaf6)';
let BG = {mode: 'default', dim: 'medium', has_custom: false};
let bgStamp = 0;

function bgCustomUrl(){
  // 背景图由插件自己的端口发；宿主只代理 /api/*，不代理 /bg/custom
  const port = (STATE && STATE.panel_port) || '';
  return port ? `http://127.0.0.1:${port}/bg/custom?v=${bgStamp}` : '';
}
function applyBackground(){
  let image = '';
  if (BG.mode === 'custom' && BG.has_custom && bgCustomUrl()){
    image = `url("${bgCustomUrl()}") center top / cover no-repeat fixed, `;
  } else if (BG.mode === 'default'){
    image = 'url("bg.jpg") center top / cover no-repeat fixed, ';
  }
  const overlay = `linear-gradient(180deg,${BG_DIM[BG.dim] || BG_DIM.medium})`;
  document.documentElement.style.setProperty('--bg-stack', `${overlay}, ${image}${BG_FALLBACK}`);
  $('ui-bg').value = BG.mode;
  $('ui-bg-dim').value = BG.dim;
  $('bg-note').textContent = BG.mode === 'custom'
    ? (BG.has_custom ? '使用你上传的图' : '还没上传，点「换背景图」')
    : (BG.mode === 'plain' ? '纯色渐变' : '插件自带');
}

async function setBackground(body){
  $('bg-note').textContent = '处理中…';
  try {
    const res = await api('/api/background', body);
    if (res.background){ BG = Object.assign({}, BG, res.background); bgStamp = Date.now(); applyBackground(); }
    $('bg-note').textContent = res.ok ? (res.message || '已应用') : (res.error || '失败');
    if (!res.ok) statusOf($('st-settings'), false, res.error || '背景设置失败');
  } catch (err){
    $('bg-note').textContent = '失败：' + err;
    statusOf($('st-settings'), false, String(err));
  }
}

$('ui-bg').onchange = async () => {
  const mode = $('ui-bg').value;
  if (mode === 'custom' && !BG.has_custom){
    $('ui-bg').value = BG.mode;      // 没传过就先弹选择框
    $('bg-file').click();
    return;
  }
  await setBackground({action: 'mode', mode});
};
$('ui-bg-dim').onchange = () => setBackground({action: 'mode', mode: BG.mode, dim: $('ui-bg-dim').value});
$('btn-bg-reset').onclick = () => setBackground({action: 'reset'});
$('btn-bg-upload').onclick = () => $('bg-file').click();
$('bg-file').onchange = async () => {
  const file = $('bg-file').files && $('bg-file').files[0];
  if (!file) return;
  if (file.size > 8 * 1024 * 1024){
    $('bg-note').textContent = `图片 ${(file.size / 1048576).toFixed(1)}MB，超过 8MB 限制`;
    $('bg-file').value = '';
    return;
  }
  $('bg-note').textContent = '上传中…';
  try {
    const dataUrl = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => resolve('');
      reader.readAsDataURL(file);
    });
    await setBackground({action: 'upload', image_base64: dataUrl});
  } catch (err){ $('bg-note').textContent = String(err); }
  $('bg-file').value = '';
};
['ui-font', 'ui-size', 'ui-trail'].forEach((id) => {
  $(id).onchange = () => {
    PREFS.ui_font = $('ui-font').value;
    PREFS.ui_font_size = $('ui-size').value;
    PREFS.ui_trail = $('ui-trail').value;
    applyPrefs();
    savePrefs();
  };
});

// ── 页签 ────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach((tab) => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t === tab));
    ['overview', 'commands', 'entries', 'settings'].forEach((name) => {
      $(`tab-${name}`).classList.toggle('hidden', name !== tab.dataset.tab);
    });
  };
});

// ── 数据渲染 ────────────────────────────────────────────────
const TYPE_LABEL = {reply: '文本回复', shell: '系统命令', http: '网络请求', plugin: '调用插件', llm: '模型生成'};
const PERM_LABEL = {user: '普通', admin: '需提权'};
const RISK_LABEL = {harmless: '无害', unknown: '无法判定', harmful: '有害'};
let STATE = {commands: [], entries: []};

function typeLabel(t){ return TYPE_LABEL[t] || t || '—'; }
function riskBadge(risk){
  if (!risk) return '';
  const cls = risk === 'harmless' ? 'on' : (risk === 'harmful' ? 'off' : 'warn');
  return `<span class="badge ${cls}">${esc(RISK_LABEL[risk] || risk)}</span>`;
}

function renderStats(d){
  const auto = d.auto_create;
  $('stat-box').innerHTML = `
    <div class="stat"><b>${d.command_count || 0}</b><span>命令</span></div>
    <div class="stat"><b>${(d.entries || []).length}</b><span>可调用能力</span></div>
    <div class="stat"><b>${(d.installed_plugins || []).length}</b><span>已装插件</span></div>
    <div class="stat"><b>${auto ? '开' : '关'}</b><span>自动学命令</span></div>
    <div class="stat"><b>${d.admin_password_set ? '已设' : '未设'}</b><span>管理员密码</span></div>`;
  $('b-model').textContent = `模型：${(d.model && d.model.model) || '未配置'}`;
  $('b-perm').textContent = `权限：${esc(d.user_permission || '—')}`;
  $('b-port').textContent = `端口：${d.panel_port || '—'}`;
  $('auto-switch').classList.toggle('on', !!auto);
  $('auto-label').textContent = auto ? '自动学新命令：已开' : '自动学新命令：已关';

  const warns = [];
  if (!d.admin_password_set){
    warns.push(['bad', '还没设置管理员密码 → <b>插件当前处于禁用状态</b>。在插件配置里设好 <code>admin_password</code> 后重启插件。']);
  }
  const model = (d.model && d.model.model) || '';
  if (!model || model.includes('free-model')){
    warns.push(['', `对话模型${model ? '是官方免费模型（插件调不了）' : '还没配置'} → 先在 N.E.K.O 设置 → 模型配置里换成自带 API Key 的第三方模型（DeepSeek / OpenAI / 通义千问 / Gemini 等）。`]);
  }
  $('warn-box').innerHTML = warns.map((w) => `<div class="notice ${w[0]}">${w[1]}</div>`).join('');

  $('plugin-list').innerHTML = (d.installed_plugins || []).length
    ? d.installed_plugins.map((id) => `<div class="item"><div class="top">
        <span class="name">${esc(id)}</span>
        <button class="ghost tiny copy" data-copy-text="${esc(id)}">复制 id</button>
      </div></div>`).join('')
    : '<div class="item empty">没有检测到已安装插件</div>';

  $('safety-box').innerHTML = `
    <div class="item"><div class="top"><span class="name">三档安全审查</span></div>
      <div class="desc">每条命令执行前会经过 AI 判定：<b>无害</b>直接执行；<b>无法判定</b>会先问你；
        <b>有害</b>需要 <code>/su</code> 提权。当前权限：${esc(d.user_permission || '—')}。</div></div>
    <div class="item"><div class="top"><span class="name">模型</span></div>
      <div class="desc">${esc(model || '未配置')}${d.model && d.model.base_url ? '　' + esc(d.model.base_url) : ''}</div></div>
    <div class="item"><div class="top"><span class="name">面板端口</span></div>
      <div class="desc">${esc(d.panel_port || '')}（只监听 127.0.0.1，本机可访问）</div></div>`;
}

function cmdRow(c){
  return `<div class="item"><div class="top">
      <span class="name">${esc(c.name)}</span>
      <span class="cid">${esc(c.id)}</span>
      <span class="badge info">${esc(typeLabel(c.type))}</span>
      <span class="badge ${c.permission === 'admin' ? 'warn' : 'info'}">${esc(PERM_LABEL[c.permission] || c.permission || '普通')}</span>
      ${riskBadge(c.risk)}
      <button class="ghost tiny copy" data-copy-text="${esc(c.id)}">复制 id</button>
    </div>
    ${c.description ? `<div class="desc">${esc(c.description)}</div>` : ''}
  </div>`;
}

function renderCommands(){
  const q = $('cmd-search').value.trim().toLowerCase();
  const type = $('cmd-type').value;
  const perm = $('cmd-perm').value;
  const all = STATE.commands || [];
  const rows = all.filter((c) => {
    if (type && c.type !== type) return false;
    if (perm && c.permission !== perm) return false;
    if (!q) return true;
    return [c.id, c.name, c.description].some((v) => String(v || '').toLowerCase().includes(q));
  });
  $('cmd-count').textContent = `${rows.length} / ${all.length}`;
  $('cmd-hint').textContent = rows.length === all.length ? '' : `（已筛选，共 ${all.length} 条）`;
  $('cmd-list').innerHTML = rows.length
    ? rows.map(cmdRow).join('')
    : '<div class="item empty">没有匹配的命令</div>';
}

function renderEntries(){
  const q = $('entry-search').value.trim().toLowerCase();
  const all = STATE.entries || [];
  const rows = all.filter((e) => !q || String(e.id || '').toLowerCase().includes(q) || String(e.desc || '').toLowerCase().includes(q));
  $('entry-count').textContent = `${rows.length} / ${all.length}`;
  $('entry-list').innerHTML = rows.length
    ? rows.map((e) => `<div class="item"><div class="top">
        <span class="cid">${esc(e.id)}</span>
        <button class="ghost tiny copy" data-copy-text="${esc(e.id)}">复制 id</button>
      </div>${e.desc ? `<div class="desc">${esc(e.desc)}</div>` : ''}</div>`).join('')
    : '<div class="item empty">没有匹配的能力</div>';
}

function fillTypeFilter(commands){
  const types = [...new Set((commands || []).map((c) => c.type).filter(Boolean))].sort();
  const sel = $('cmd-type');
  const current = sel.value;
  sel.innerHTML = '<option value="">全部类型</option>' + types.map((t) => `<option value="${esc(t)}">${esc(typeLabel(t))}</option>`).join('');
  if (types.includes(current)) sel.value = current;
}

async function loadStatus(){
  busy($('st-overview'), '正在读取…');
  try {
    const d = await api('/api/status');
    STATE = d;
    if (d.prefs) { PREFS = Object.assign({}, PREFS, d.prefs); applyPrefs(); }
    if (d.background){ BG = Object.assign({}, BG, d.background); bgStamp = Date.now(); applyBackground(); }
    renderStats(d);
    fillTypeFilter(d.commands);
    renderCommands();
    renderEntries();
    $('pill-dot').classList.toggle('on', true);
    $('pill-text').textContent = `面板 ${d.panel_port} · 命令 ${d.command_count}`;
    statusOf($('st-overview'), true, '已更新');
  } catch (err){
    $('pill-dot').classList.toggle('off', true);
    $('pill-text').textContent = err && err.noService ? '连不上面板服务' : '读取失败';
    statusOf($('st-overview'), false, String(err));
    $('warn-box').innerHTML = `<div class="notice bad">${esc(String(err))}</div>`;
  }
}

$('cmd-search').oninput = renderCommands;
$('cmd-type').onchange = renderCommands;
$('cmd-perm').onchange = renderCommands;
$('cmd-reset').onclick = () => {
  $('cmd-search').value = '';
  $('cmd-type').value = '';
  $('cmd-perm').value = '';
  renderCommands();
};
$('entry-search').oninput = renderEntries;

// ── 操作 ────────────────────────────────────────────────────
$('btn-reload').onclick = async () => {
  busy($('st-settings'), '重载中…');
  try {
    const res = await api('/api/reload', {});
    await loadStatus();
    statusOf($('st-settings'), true, `已重载，命令 ${res.command_count} 条`);
  } catch (err){ statusOf($('st-settings'), false, String(err)); }
};

async function setAuto(enable){
  busy($('st-settings'), '切换中…');
  try {
    await api('/api/toggle_auto_create', {enabled: enable});
    await loadStatus();
    statusOf($('st-settings'), true, enable ? '已开启自动学命令' : '已关闭自动学命令');
  } catch (err){ statusOf($('st-settings'), false, String(err)); }
}
const flipAuto = () => setAuto(!$('auto-switch').classList.contains('on'));
$('auto-switch').onclick = flipAuto;
$('auto-switch').onkeydown = (ev) => {
  if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); flipAuto(); }
};

// ── 复制：命令 id / 能力 id 最常要复制到别处 ─────────────────────
document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('[data-copy-text]');
  if (!btn) return;
  const text = btn.dataset.copyText || '';
  const rect = btn.getBoundingClientRect();
  const at = {x: rect.left + rect.width / 2, y: rect.top - 6};
  try {
    await navigator.clipboard.writeText(text);
    floatText('已复制', at);
  } catch (err){
    // 剪贴板被禁时退回"帮用户选中"——注意要选那个 id，不是按钮上的"复制 id"字样
    const holder = btn.parentElement ? btn.parentElement.querySelector('.cid') : null;
    const range = document.createRange();
    range.selectNodeContents(holder || btn);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    floatText(holder ? '已选中，按 Ctrl+C' : '复制失败，请手动复制', at);
  }
});

loadStatus();
</script>
