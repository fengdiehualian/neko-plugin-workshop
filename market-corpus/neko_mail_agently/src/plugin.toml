[plugin]
id = "neko_mail_agently"
name = "猫娘邮箱(Agently)"
short_description = "给猫娘注册并管理专属 Agently 邮箱(@agent.qq.com)，支持收发/搜索/回复/转发/附件，新邮件自动提醒。"
keywords = [
    "邮箱", "邮件", "猫娘邮箱", "专属邮箱", "Agently", "agent.qq.com",
    "mail", "email", "agent mail", "inbox", "注册邮箱", "邮件提醒"
]
description = """
通过腾讯 Agently Mail 为猫娘注册并管理一个独属于她自己的邮箱（@agent.qq.com），\
让猫娘能够自主收发、阅读、搜索、回复、转发邮件、下载附件，并在收到新邮件时主动提醒你。

【什么是 Agently Mail】
Agently Mail 是腾讯 QQ 邮箱团队推出的 AI Agent 专属邮箱服务。\
它与你的个人 QQ 邮箱完全物理隔离：猫娘只能读写这个专属邮箱，绝对碰不到你的私人邮件，安全放心。\
官网：https://agent.qq.com （每个微信号可免费创建最多 2 个专属邮箱）

【首次配置（共 3 步）】
第 1 步：安装 Node.js 18+（官网 https://nodejs.org 下载安装，一路下一步即可）
第 2 步：打开终端（PowerShell 或 CMD），执行：npm install -g @tencent-qqmail/agently-cli
第 3 步：对猫娘说"帮我登录邮箱"，她会自动启动授权流程并在浏览器中打开授权页面，\
你用微信扫码完成注册/授权（此邮箱与你个人邮箱隔离，可放心授权）。
授权成功后猫娘会自动获得自己的专属邮箱地址 xxx@agent.qq.com，无需任何手动配置。

【还没有专属邮箱？】
对猫娘说"打开邮箱管理页面"，她会在浏览器中打开 agent.qq.com，\
微信扫码登录后可直接创建猫娘的专属邮箱（好名字先到先得）。

【日常使用（直接和猫娘说话即可）】
- "看看有没有新邮件" / "读一下 XX 发来的那封邮件"
- "给 xxx@example.com 发一封邮件，主题是...，内容是..."
- "回复一下刚才那封邮件" / "把那封邮件转发给 XX"
- "把那封邮件的附件下载到桌面"
- "检查一下邮箱状态" / "诊断一下邮箱问题"
发送/回复/转发/删除均为两阶段确认：猫娘会先展示操作摘要，你确认后才会真正执行，防止误操作。

【新邮件自动提醒】
插件默认每 30 秒自动检查一次未读邮件，有新邮件时猫娘会主动告诉你发件人和主题。

【高级配置（编辑本文件 [neko_mail_agently] 小节）】
- cli_path：留空表示自动探测 Agently CLI（支持 Windows/macOS/Linux），无需手动填写；\
仅当自动探测失败时才需要手动指定 agently-cli 的完整路径
- email_addr：留空表示登录后自动获取，一般无需填写
- polling_interval：新邮件轮询间隔（秒），默认 30
- auto_open_browser：登录时是否自动打开浏览器，默认 true
详细图文教程与常见问题解答见插件目录内的 README.md。
"""
version = "1.1.2"
type = "plugin"
entry = "plugin.plugins.neko_mail_agently:NekoMailAgentlyEntry"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[neko_mail_agently]
# Agently CLI 可执行文件路径，留空 = 自动探测（推荐）
cli_path = ""
# 猫娘专属邮箱地址，留空 = 授权登录后自动获取（推荐）
email_addr = ""
# 授权过期时自动尝试刷新令牌
auto_refresh_auth = true
# 新邮件轮询间隔（秒）
polling_interval = 30
# 发送等写操作启用两阶段确认
two_factor_confirm = true
# 登录授权时自动在浏览器中打开授权页面
auto_open_browser = true
