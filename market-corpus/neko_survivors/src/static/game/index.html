<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>猫娘姐妹 / NEKO Sisters</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='10' fill='%23ff7bac'/%3E%3Cpath d='M8 12 L10 3 L16 9 Z M24 12 L22 3 L16 9 Z' fill='%23ff7bac'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- 第一百三十九轮：暂停属性方块的小图标库（暗金/淡紫 currentColor 描边） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-damage" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M19 5l-8.5 8.5M19 5h-3.2M19 5v3.2M8.5 15.5l-2 2M6 13l5 5M4 20l2.5-2.5"/>
    </symbol>
    <symbol id="i-atkspeed" viewBox="0 0 24 24" fill="currentColor">
      <path d="M13 2L4.5 13.5h5L8 22l9.5-11.5h-5.2L13 2z"/>
    </symbol>
    <symbol id="i-crit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/>
      <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-critdmg" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2l2.1 6.4L20.5 10l-6.4 2.1L12 18.5 9.9 12.1 3.5 10l6.4-1.6L12 2z"/>
    </symbol>
    <symbol id="i-armor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M12 2.5l7.5 3v5.5c0 5.2-3.8 8.6-7.5 10.5C8.3 19.6 4.5 16.2 4.5 11V5.5l7.5-3z"/>
    </symbol>
    <symbol id="i-dodge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M3 8h9.5a2.8 2.8 0 1 0-2.8-2.8M3 12.5h13.5a3 3 0 1 1-3 3M3 17h6.5"/>
    </symbol>
    <symbol id="i-speed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 5l7 7-7 7M12.5 5l7 7-7 7"/>
    </symbol>
    <symbol id="i-paw" viewBox="0 0 24 24" fill="currentColor">
      <ellipse cx="12" cy="15.6" rx="5" ry="4.1"/>
      <circle cx="6.2" cy="9.6" r="2.2"/><circle cx="12" cy="7.4" r="2.3"/><circle cx="17.8" cy="9.6" r="2.2"/>
    </symbol>
    <symbol id="i-gem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M12 3l7 6-7 12L5 9l7-6zM5 9h14M12 3v18" stroke-width="1.6"/>
    </symbol>
    <symbol id="i-drop" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2.5s6.5 7 6.5 11.5a6.5 6.5 0 0 1-13 0C5.5 9.5 12 2.5 12 2.5z"/>
    </symbol>
    <!-- ===== 第一百六十轮：升级选项图标（补齐暂停十图标没覆盖的强化） ===== -->
    <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M12 20 C5.5 14.5 3.5 10.5 3.5 7.8 C3.5 5.4 5.4 3.5 7.8 3.5 C9.6 3.5 11.1 4.6 12 6.2 C12.9 4.6 14.4 3.5 16.2 3.5 C18.6 3.5 20.5 5.4 20.5 7.8 C20.5 10.5 18.5 14.5 12 20 Z"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M9.5 4 h5 v5.5 H20 v5 h-5.5 V20 h-5 v-5.5 H4 v-5 h5.5 Z"/>
    </symbol>
    <symbol id="i-magnet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M7 4 v7 a5 5 0 0 0 10 0 V4 M4 4 h6 M14 4 h6 M4 9 h6 M14 9 h6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-range" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="3.2"/><path d="M12 3.5 a8.5 8.5 0 0 1 8.5 8.5 M12 20.5 a8.5 8.5 0 0 1 -8.5 -8.5" stroke-dasharray="3.5 3"/>
    </symbol>
    <symbol id="i-sword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 19 L14.5 9.5 M12.5 5.5 L18.5 11.5 M9.5 14.5 L5.5 18.5 M14.5 9.5 L19 5"/>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 19.5 L18.5 5.5 M18.5 5.5 h-6.5 M18.5 5.5 v6.5 M8 16 l-3.5 3.5"/>
    </symbol>
    <symbol id="i-orb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.5"/><path d="M12 2.5 v3.2 M12 18.3 v3.2 M2.5 12 h3.2 M18.3 12 h3.2 M5.5 5.5 l2.2 2.2 M16.3 16.3 l2.2 2.2 M18.5 5.5 l-2.2 2.2 M7.7 16.3 l-2.2 2.2"/>
    </symbol>
    <symbol id="i-burst" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M12 2.5 L14 9.5 L21.5 12 L14 14.5 L12 21.5 L10 14.5 L2.5 12 L10 9.5 Z"/>
    </symbol>
    <symbol id="i-coin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="8.5"/><path d="M8.5 10.5 l3.5 4 l3.5 -4 M12 14.5 v4.5 M9 14 h6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-rage" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4.5 4.5 L19.5 19.5 M19.5 4.5 L4.5 19.5"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>
    </symbol>
  </defs>
</svg>
<div id="app">
  <canvas id="game"></canvas>

  <!-- ===== 游戏内 HUD ===== -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-wave">
        <span class="hud-label">WAVE</span>
        <span id="hud-wave-num">1</span>
        <span class="hud-sub">/ 20</span>
        <span id="hud-difficulty" class="hud-difficulty"></span>
      </div>
      <div class="hud-timer">
        <div id="hud-timer-label" style="display:none"></div>
        <div id="hud-timer-text">30</div>
        <div class="hud-timer-bar"><div id="hud-timer-fill"></div></div>
      </div>
      <div class="hud-materials">
        <span class="mat-icon"></span>
        <span id="hud-materials">0</span>
      </div>
    </div>

    <div class="hud-bottom">
      <!-- 第一百三十八轮二改（用户："把道具和那些小属性的显示提到血条上面"）：
           武器框/属性栏在上，血条行垫底 —— 底部只留"血条 + 经验条"双条面板。
           血条本体改纯 Canvas（renderer._drawHudBars），壳只做占位。 -->
      <div id="hud-weapons" class="hud-weapons"></div>
      <div id="hud-stats" class="hud-stats"></div>
      <div class="hud-hp" aria-hidden="true">
        <div class="hud-hp-bar"></div>
        <div id="hud-hp-ghost"></div>
      </div>
    </div>

    <!-- 第一百三十八轮：经验条与 Lv 改为纯 Canvas 绘制（renderer._drawXpBar），
         DOM 版退役 —— 视觉大重构：渐变光带/猫爪节点/呼吸充能/高光滑点/Lv 弹跳。 -->

    <div id="hud-toast" class="hud-toast"></div>
  </div>

  <!-- ===== NEKO 猫娘区域 =====
       宿主提供 avatar-renderer 时，当前猫娘（宿主决定名字）的 Live2D 会挂进 #neko-avatar-slot。
       独立运行时这一整块保持隐藏，不影响游戏。 -->
  <div id="neko-panel" class="neko-panel">
    <div id="neko-status" class="neko-status hidden"></div>
    <div id="neko-avatar-slot" class="neko-avatar-slot"></div>
    <div id="neko-bubble-slot" class="neko-bubble-slot"></div>
  </div>

  <!-- ===== 覆盖层：标题 / 选人 / 商店 / 升级 / 结算 ===== -->
  <div id="overlay"></div>
</div>

<script type="module" src="src/main.js?v=0.4.18"></script>
</body>
</html>
