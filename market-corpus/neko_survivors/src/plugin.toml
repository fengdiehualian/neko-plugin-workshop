[plugin]
id = "neko_survivors"
name = "猫娘姐妹：幸存者"
type = "plugin"
description = "自带完整游戏的弹幕生存肉鸽：WASD 走位躲避围攻，武器全自动开火，收集材料升级、合成装备，在 20 波敌潮里活下来。打开插件面板直接开玩，无需任何配置；纯静态实现，装完即玩。噩梦难度还藏着一个隐藏 Boss，等你发现。"
short_description = "躲弹幕捡材料合成神装，猫娘武器全自动，点开就玩喵！"
keywords = ["游戏", "幸存者", "肉鸽", "弹幕", "生存", "roguelite", "game", "survivors", "猫娘姐妹", "单机"]
version = "0.4.18"
entry = "plugin.plugins.neko_survivors:SurvivorsPlugin"

[plugin.author]
name = "yousei1216"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.store]
enabled = false

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "猫娘姐妹：幸存者"
entry = "static/index.html"
context = "neko_survivors"
permissions = ["action:call"]

[plugin_runtime]
enabled = true
auto_start = true
