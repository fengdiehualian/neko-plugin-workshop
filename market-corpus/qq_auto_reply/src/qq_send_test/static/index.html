<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ 发送测试</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 24px; max-width: 760px; }
  h1 { font-size: 20px; }
  .row { margin: 12px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { padding: 6px 14px; cursor: pointer; }
  input { padding: 6px; width: 200px; }
  pre { background:#f4f4f6; padding: 12px; border-radius: 8px; overflow: auto; max-height: 40vh; white-space: pre-wrap; word-break: break-all; }
  ul#live { list-style:none; padding:0; margin:0; }
  ul#live li { background:#eef3ff; padding:8px 10px; border-radius:6px; margin:6px 0; }
  ul#live li .meta { color:#666; font-size:12px; }
  .status { color:#666; font-size:13px; margin-left:4px; }
  .stat { color:#888; font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<h1>QQ 发送测试 (qq_send_test)</h1>

<div class="row">
  <button id="btn-send">发送测试消息</button>
  <input id="f-topic" value="" placeholder="群号 / 收件人" />
  <input id="f-text" value="" style="width:360px" placeholder="要逐字发送的内容" />
</div>
<div class="row">
  <button id="btn-recv">重新加载已收到的</button>
  <button id="btn-ping">探测 qq_auto_reply 调用耗时</button>
</div>

<h2 style="font-size:15px;margin-top:20px">📥 实时接收（SSE / ui-api/events）</h2>
<div class="stat" id="live-status">连接中…</div>
<ul id="live"><li style="color:#999">等待 QQ 消息…</li></ul>

<pre id="out">（点击按钮看调用结果；实时接收在下方列表）</pre>

<script>
const pluginId = 'qq_send_test';
const SOURCE_PLUGIN = 'qq_auto_reply';   // 桥接的源插件 id（唯一硬编码处）
const live = document.getElementById('live');
const liveStatus = document.getElementById('live-status');
const out = document.getElementById('out');
const status = document.getElementById('status');

// 实时接收：EventSource 订阅 /plugin/qq_auto_reply/ui-api/events（SSE）
function addReceived(data) {
  const first = live.querySelector('li[data-empty]');
  if (first) first.remove();
  const li = document.createElement('li');
  const meta = `${data.sender || data.user_id || '?'}${data.sender_nickname ? ' ('+data.sender_nickname+')' : ''}`
    + ` → ${data.recipient || data.group_id || '?'}${data.recipient_type ? ' · '+data.recipient_type : ''}`;
  li.innerHTML = `<div>${escapeHtml(data.text || data.content || '')}</div><div class="meta">${escapeHtml(meta)}</div>`;
  live.prepend(li);
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function connectSSE() {
  liveStatus.textContent = '连接中…';
  const es = new EventSource('/plugin/' + SOURCE_PLUGIN + '/ui-api/events');
  es.onopen = () => { liveStatus.textContent = '已连接 · 实时接收中'; };
  es.onmessage = (e) => {
    try {
      const ev = JSON.parse(e.data);
      if (ev.type === 'qq_message' && ev.data && typeof ev.data === 'object') addReceived(ev.data);
    } catch (_) {}
  };
  es.onerror = () => { liveStatus.textContent = '连接断开，重试…'; };
}

async function callPlugin(entry, args = {}) {
  status.textContent = '调用 ' + entry + ' …';
  const r = await fetch('/runs', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ plugin_id: pluginId, entry_id: entry, args }),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const { run_id, id } = await r.json();
  const runId = run_id || id;
  if (!runId) throw new Error('未获取到 run_id');
  const sleep = ms => new Promise(rs => setTimeout(rs, ms));
  for (let i = 0; i < 120; i++) {
    const s = await fetch('/runs/' + runId);
    if (!s.ok) { await sleep(1000); continue; }
    const rec = await s.json();
    const st = rec.status;
    if (['succeeded', 'failed', 'canceled', 'timeout'].includes(st)) {
      if (st !== 'succeeded') throw new Error('run ' + st);
      const exp = await fetch('/runs/' + runId + '/export');
      if (!exp.ok) return {};
      const { items = [] } = await exp.json();
      const item = items.find(x => x.type === 'json' && x.json) || items[0];
      if (!item) return {};
      let raw = item.json || {};
      while (raw && raw.data && typeof raw.data === 'object' && ('success' in raw.data || 'error' in raw.data)) raw = raw.data;
      if (raw && raw.success && raw.data && typeof raw.data === 'object') raw = raw.data;
      return raw;
    }
    await sleep(600);
  }
  throw new Error('轮询 run 超时');
}
const show = (label, data, err) => {
  status.textContent = '';
  out.textContent = '[' + label + ']\n' + (err ? ('ERROR: ' + err) : JSON.stringify(data, null, 2));
};

document.getElementById('btn-send').onclick = async () => {
  const g = document.getElementById('f-topic').value.trim();
  const t = document.getElementById('f-text').value.trim();
  if (!g || !t) { show('send_test', null, '请填写群号/收件人与要发送的内容'); return; }
  try { const d = await callPlugin('send_test', { group_id: g, text: t }); show('send_test', d); }
  catch (e) { show('send_test', null, e.message); }
};
document.getElementById('btn-recv').onclick = async () => {
  try {
    const d = await callPlugin('get_received', {});
    show('get_received', d);
    (d.received || []).slice().reverse().forEach(addReceived);
  } catch (e) { show('get_received', null, e.message); }
};
document.getElementById('btn-ping').onclick = async () => {
  try { const d = await callPlugin('ping_qq', {}); show('ping_qq', d); }
  catch (e) { show('ping_qq', null, e.message); }
};

connectSSE();
</script>
</body>
</html>
