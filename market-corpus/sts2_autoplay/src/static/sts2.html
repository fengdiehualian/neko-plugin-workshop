<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS2 功能</title>
<style>
/* ===== neko-kit:tokens 起
   主题 token 全部取自 N.E.K.O 本体（只读基准）：
   frontend/plugin-manager/src/components/plugin/hosted/ui-kit/styles.css:1-32
   frontend/plugin-manager/src/assets/styles/variables.css:5-11 ===== */
:root{
  color-scheme:light dark;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:20px;
  --bg:#f7f9fc;--surface:rgba(255,255,255,.84);--surface-strong:rgba(255,255,255,.96);
  --text:#1f2937;--muted:#667085;--border:rgba(148,163,184,.36);
  --primary:#409eff;--success:#67c23a;--warning:#e6a23c;--danger:#f56c6c;--info:#14b8a6;
  --primary-bg:rgba(64,158,255,.12);--primary-border:rgba(64,158,255,.38);
  --success-bg:rgba(103,194,58,.10);--success-border:rgba(103,194,58,.38);
  --warning-bg:rgba(230,162,60,.11);--warning-border:rgba(230,162,60,.32);
  --danger-bg:rgba(245,108,108,.10);--danger-border:rgba(245,108,108,.38);
  --alert-bg:rgba(64,158,255,.08);--alert-border:rgba(64,158,255,.26);
  --ghost-bg:rgba(148,163,184,.10);--subtle:rgba(148,163,184,.08);--hover:rgba(64,158,255,.06);
  --shadow-soft:0 12px 36px rgba(15,23,42,.12);--focus:#40c5f1;
  --page-max:560px;--page-pad:18px;--gap:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f172a;--surface:rgba(15,23,42,.78);--surface-strong:rgba(17,24,39,.94);
  --text:#e5e7eb;--muted:#94a3b8;--border:rgba(148,163,184,.22);
  --subtle:rgba(148,163,184,.12);--shadow-soft:0 18px 48px rgba(0,0,0,.22);
}}
/* ===== neko-kit:tokens 止 ===== */
/* ===== neko-kit:base 起（骨架：reset / body / .wrap / 顶栏三件套 / 焦点环）===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);font-size:14px;line-height:1.65;background:var(--bg);color:var(--text);padding:var(--page-pad) var(--page-pad) 40px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:var(--page-max);margin:0 auto}
.top{margin-bottom:var(--gap)}
.back-btn{display:inline-flex;align-items:center;min-height:32px;padding:6px 12px;background:var(--surface-strong);color:var(--muted);border:1px solid var(--border);border-radius:var(--radius-md);font-size:12px;font-weight:650;text-decoration:none;transition:background-color .14s ease,border-color .14s ease,color .14s ease}
.back-btn:hover{color:var(--primary);border-color:var(--primary-border)}
h1{font-size:22px;font-weight:760;letter-spacing:.3px;line-height:1.35;margin:0 0 4px}
.sub{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 18px}
a:focus-visible,button:focus-visible,summary:focus-visible,[tabindex]:not([tabindex="-1"]):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.loss{color:var(--danger)}
.safe{color:var(--success)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--subtle);border-radius:999px}
@media (max-width:520px){body{padding:16px 12px 40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== neko-kit:base 止 ===== */

/* ===== neko-kit:ui 起（组件：面板卡 / 统计卡 / 徽标 / 按钮三档 / 表格 / 提示 / 空态 / 折叠 / 结果框）===== */
.card,.run{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px 14px;margin-bottom:var(--gap)}
.card>h3,.run>h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;font-weight:720;color:var(--text);line-height:1.4;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.cards>.card{display:grid;gap:6px;padding:14px;border-radius:var(--radius-lg);margin-bottom:0}
.cards>.card .k{color:var(--muted);font-size:12px;font-weight:650}
.cards>.card .v{color:var(--text);font-size:24px;font-weight:780;line-height:1.1;font-variant-numeric:tabular-nums}
.k{color:var(--muted);font-size:12px;font-weight:650}
.box .k{margin-bottom:6px}
.reflect .k{margin-bottom:4px}
.grp-title{color:var(--text);font-size:12px;font-weight:720;margin-bottom:6px}
.grp+.grp{margin-top:var(--gap)}
.note{color:var(--muted);font-size:12px;line-height:1.6;margin-top:6px}
button{min-height:36px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--ghost-bg);color:var(--text);font:inherit;font-size:13px;font-weight:650;cursor:pointer;transition:transform .14s ease,background-color .14s ease,border-color .14s ease,color .14s ease,box-shadow .14s ease}
button:hover{transform:translateY(-1px);background:var(--hover);border-color:var(--primary-border);color:var(--primary)}
button:active:not(:disabled){transform:none}
button:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
button.primary{background:var(--primary-bg);border-color:var(--primary-border);color:var(--primary)}
button.primary:hover{background:rgba(64,158,255,.18);border-color:var(--primary-border);color:var(--primary);box-shadow:0 8px 18px rgba(64,158,255,.14)}
button.ghost{background:var(--ghost-bg);border-color:var(--border);color:var(--text)}
button.ghost:hover{background:var(--hover);border-color:var(--primary-border);color:var(--primary);box-shadow:none}
button.danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
button.danger:hover{background:rgba(245,108,108,.16);border-color:var(--danger-border);color:var(--danger);box-shadow:0 8px 18px rgba(245,108,108,.16)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;width:fit-content;padding:4px 9px;border:1px solid var(--border);border-radius:999px;background:var(--surface-strong);color:var(--muted);font-size:12px;font-weight:650;line-height:1.6;white-space:nowrap}
.tag::before{content:"";width:7px;height:7px;border-radius:999px;background:var(--primary)}
.tag.victory{border-color:var(--success-border);background:var(--success-bg);color:var(--success)}
.tag.victory::before{background:var(--success)}
.tag.defeat{border-color:var(--danger-border);background:var(--danger-bg);color:var(--danger)}
.tag.defeat::before{background:var(--danger)}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:var(--gap)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--gap);margin-top:10px}
.box{background:var(--subtle);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;overflow-x:auto}
ul{margin:0;padding-left:17px}
li{margin:3px 0}
table{border-collapse:separate;border-spacing:0;width:100%;margin-top:10px;font-size:12px;overflow:hidden;background:var(--surface-strong);border:1px solid var(--border);border-radius:var(--radius-lg)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:650;background:var(--subtle);white-space:nowrap}
tbody tr{transition:background-color .14s ease}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:none}
.rooms td:nth-child(1),.rooms td:nth-child(3),.rooms td:nth-child(5){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rooms th:nth-child(1),.rooms th:nth-child(3),.rooms th:nth-child(5){text-align:right}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:8px}
.route .step{background:var(--subtle);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px 9px;font-size:12px;white-space:nowrap}
.route .step.safe{border-color:var(--success-border);color:var(--success)}
.route .arrow{color:var(--muted);font-size:12px}
.reflect,.alert{border:1px solid var(--alert-border);border-radius:var(--radius-lg);padding:12px 14px;background:var(--alert-bg);color:var(--text);line-height:1.65;margin-top:var(--gap)}
.empty{display:grid;gap:8px;place-items:center;padding:26px;color:var(--muted);text-align:center;border:1px dashed var(--border);border-radius:var(--radius-lg);background:var(--surface)}
code{background:var(--subtle);border:1px solid var(--border);color:var(--primary);padding:1px 6px;border-radius:var(--radius-sm);font-size:12px;font-family:var(--mono)}
details{margin-top:var(--gap)}
details summary{cursor:pointer;display:inline-flex;align-items:center;min-height:36px;padding:8px 14px;background:var(--ghost-bg);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text);font-size:13px;font-weight:700;transition:background-color .14s ease,border-color .14s ease,color .14s ease}
details summary:hover{background:var(--hover);border-color:var(--primary-border);color:var(--primary)}
#result{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--radius-md);padding:12px 14px;margin-top:14px;font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--muted);white-space:pre-wrap;max-height:200px;overflow:auto}
@media (max-width:520px){.cards{grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px}.cards>.card{padding:12px}.cards>.card .v{font-size:20px}.card,.run{padding:12px 12px 14px}th,td{padding:8px 10px}.btn-row button,.toolbar button{flex:1 1 auto}}
/* ===== neko-kit:ui 止 ===== */
</style>
</head>
<body>
<div class="wrap">
    <div class="top"><a class="back-btn" href="index.html">← 返回</a></div>
    <h1>STS2 功能</h1>
    <p class="sub">杀戮尖塔 2 自动游玩与陪玩控制</p>

    <div class="card">
        <h3>运行控制</h3>
        <div class="btn-row">
            <button class="primary" onclick="runEntry('sts2_start_autoplay')">开始自动玩</button>
            <button class="ghost" onclick="runEntry('sts2_pause_autoplay')">暂停</button>
            <button class="ghost" onclick="runEntry('sts2_resume_autoplay')">恢复</button>
            <button class="danger" onclick="runEntry('sts2_stop_autoplay')">停止</button>
            <button class="ghost" onclick="runEntry('sts2_set_standby', {standby:true})">待机</button>
            <button class="ghost" onclick="runEntry('sts2_set_standby', {standby:false})">取消待机</button>
        </div>
    </div>

    <div class="card">
        <h3>陪玩模式</h3>
        <div class="btn-row">
            <button class="primary" onclick="runEntry('sts2_enable_companion_mode')">开启陪玩</button>
            <button class="ghost" onclick="runEntry('sts2_disable_companion_mode')">关闭陪玩</button>
        </div>
    </div>

    <div class="card">
        <h3>游戏内弹幕</h3>
        <div class="btn-row">
            <button class="primary" onclick="runEntry('sts2_set_danmaku', {enabled:true})">打开弹幕</button>
            <button class="ghost" onclick="runEntry('sts2_set_danmaku', {enabled:false})">关闭弹幕（清屏）</button>
        </div>
    </div>

    <div class="card">
        <h3>跟本体说话</h3>
        <p class="note">这两个开关只影响「跟本体说话」这一路：游戏内弹幕、自动游玩、历史记录都不受影响。</p>

        <div class="grp">
            <p class="grp-title">尖塔速报</p>
            <div class="btn-row">
                <button class="primary" onclick="runEntry('sts2_set_host_digest', {enabled:true})">打开速报</button>
                <button class="ghost" onclick="runEntry('sts2_set_host_digest', {enabled:false})">关闭速报</button>
            </div>
            <p class="note">开着时插件把局势悄悄交给本体，由它主动讲一句；关掉只是它不再主动讲，其它一切照旧。</p>
        </div>

        <div class="grp">
            <p class="grp-title">尖塔复盘</p>
            <div class="btn-row">
                <button class="primary" onclick="runEntry('sts2_set_run_reflection', {enabled:true})">打开复盘</button>
                <button class="ghost" onclick="runEntry('sts2_set_run_reflection', {enabled:false})">关闭复盘</button>
            </div>
            <p class="note">开着时每局结束生成一次复盘并交给本体；关掉只记数据、不反思，损血归因与历史页照旧可看。</p>
        </div>
    </div>

    <div class="card">
        <h3>存档</h3>
        <div class="btn-row">
            <button class="primary" onclick="runEntry('sts2_continue_run')">回到存档继续玩</button>
        </div>
    </div>

    <div class="card">
        <h3>查询</h3>
        <div class="btn-row">
            <button class="ghost" onclick="runEntry('sts2_get_status')">查看状态</button>
            <button class="ghost" onclick="runEntry('sts2_read_state')">当前局面</button>
            <button class="ghost" onclick="runEntry('sts2_get_planned_operation')">规划动作</button>
            <button class="ghost" onclick="runEntry('sts2_health_check')">健康检查</button>
        </div>
    </div>

    <div class="card">
        <h3>执行</h3>
        <div class="btn-row">
            <button class="primary" onclick="runEntry('sts2_execute_planned_operation')">执行规划动作</button>
        </div>
    </div>

    <div id="result">点击按钮查看结果…</div>
</div>

<script>
const PLUGIN_ID = 'sts2_autoplay';
const resultEl = document.getElementById('result');

async function runEntry(entryId, args) {
    resultEl.textContent = '执行中…';
    try {
        const create = await fetch('/runs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ plugin_id: PLUGIN_ID, entry_id: entryId, args: args || {} }),
        });
        const created = await create.json();
        if (!created.run_id) throw new Error('run 创建失败');
        // 轮询直到完成
        let done = null;
        for (let i = 0; i < 20; i++) {
            const r = await fetch(`/runs/${created.run_id}`, { cache: 'no-store' });
            const d = await r.json();
            if (d.stage === 'done' || d.status === 'succeeded' || d.status === 'failed') { done = d; break; }
            await new Promise(res => setTimeout(res, 1000));
        }
        if (!done) { resultEl.textContent = '执行超时'; return; }
        if (done.status === 'failed') {
            resultEl.textContent = '失败: ' + JSON.stringify(done.error || {}, null, 2);
            return;
        }
        const exp = await fetch(`/runs/${created.run_id}/export`, { cache: 'no-store' });
        const exportData = await exp.json();
        const item = (exportData.items || [])[0] || {};
        const json = item.json || {};
        // 显示摘要或结果
        const data = json.data || {};
        const summary = data.summary || data.message || data;
        resultEl.textContent = typeof summary === 'string' ? summary : JSON.stringify(summary, null, 2);
    } catch (err) {
        resultEl.textContent = '执行失败: ' + err;
    }
}
</script>
</body>
</html>
