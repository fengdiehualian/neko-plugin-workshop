# Generated by neko-plugin
# managed-template: plugin-market-actions-v1
target-version = "py311"
line-length = 120
extend-exclude = ["vendor"]
respect-gitignore = false

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
# 市场 CI 的 ruff 跑在**插件仓库的父目录**里（``--isolated`` ⇒ 本文件被忽略），
# isort 的「首方包」判定基准因此落在父目录 ⇒ ``engine`` / ``storage`` / ``modes``
# / ``tests`` 都被判成**第三方**；而本地在仓库根跑时判定基准是仓库根，
# 它们是**第一方**。两边的分组顺序会打架（本地过、CI 挂）。
# 这里显式钉死成第三方，让本地与 CI 的判定**完全一致**。
known-third-party = ["engine", "modes", "storage", "tests"]
