# 拟股喵喵 · 业务配置示例
#
# 本文件是插件首次运行时 `config.example.toml` → `self.config` 的模板。
# 硬约束：本文件**不得包含 `[plugin]` 段**，否则 `neko-plugin check` 会直接报 error。
# 本文件里**只有业务参数**，插件身份与能力开关一律写在 `plugin.toml`。
#
# 教育目的声明：所有数值均为反诈沙盘的虚构游戏参数，无任何金融含义；
# 本项目不提供充值、提现、兑换、入金、出金一类功能，也不对接任何真实行情。

# ---------------------------------------------------------------------------
# 上头指数（heat）——实时曲线，不是累计总分
# ---------------------------------------------------------------------------
[heat]
# 衰减系数：H_new = H_old * decay + 本 tick 事件分
decay = 0.85
# 峰值检测阈值：H_old 超过该值才可能被判定为"上头"
peak_threshold = 40.0
# 峰值检测窗口：H_old 必须是最近 N 个 tick 的最高点
peak_window = 5
# 集中度状态分档位（占比 -> 事件分）
concentration_50 = 10.0
concentration_70 = 25.0
concentration_90 = 40.0
# 收割触发所需的最低集中度（0~1）。越集中，那一刀跌得越狠。
harvest_concentration_threshold = 0.5

# ---------------------------------------------------------------------------
# 市场引擎
# ---------------------------------------------------------------------------
[market]
# 每日 tick 数（经典模式 12，无限模式 48）
classic_ticks_per_day = 12
infinite_ticks_per_day = 48
# 单局随机行情的初始标的数量
initial_symbols = 20
# 越往后越混沌：sigma 随天数递增的步长
sigma_growth_per_day = 0.01
# sigma 上限，防止尾部过度膨胀
sigma_max = 0.40
# 退市地板：价格触及该地板即退市（标的死亡，返回 None）
delisting_floor = 0.01
# 手续费池：全局累加，只显示与销毁，不分配给任何人
fee_pool_reveal = true
# 一次心跳最多补几个 tick（防止机器休眠后一口气补几十个）
max_catchup_ticks = 3
# 单个 tick 的耗时告警阈值（秒）
tick_warn_seconds = 5.0
# 单个 tick 的耗时跳过阈值（秒），超过则放弃本次 tick（不写回）
tick_skip_seconds = 15.0
# 心跳自身的耗时告警阈值（毫秒）
heartbeat_warn_ms = 100.0
# 退市缓冲区：价格不高于「地板 × 该倍数」的标的进入缓冲区
delisting_buffer_ratio = 3.0
# 缓冲区内标的每 tick 被击穿退市的概率（用退市流抽样）
delisting_prob_per_tick = 0.05

# ---------------------------------------------------------------------------
# 费率（纯虚构游戏数值）
# ---------------------------------------------------------------------------
[fees]
# 买入佣金
buy_rate = 0.003
# 卖出佣金
sell_rate = 0.005
# 卖出印花税（只在卖出方向收取）
stamp_tax_rate = 0.001

# ---------------------------------------------------------------------------
# 二道贩子（Pawnbroker）——教育用途：模拟"急用钱只能被压价收割"
# ---------------------------------------------------------------------------
[pawnbroker]
# 强制卖出回收价折扣的基础部分：市价 * (1 - base_discount - urgent_extra * 紧急度)
base_discount = 0.20
# 紧急加成：缺口越大压得越狠
urgent_extra = 0.30
# 主动买入溢价：市价 * (1 + base_premium + urgent_extra * 紧急度)
base_premium = 0.15
# 买入紧急加成
urgent_premium = 0.25
# 当天买入的标的强制卖出回收价折扣（模拟当天买当天被压价）
same_day_discount = 0.40

# ---------------------------------------------------------------------------
# 经典模式（四档）
# ---------------------------------------------------------------------------
[classic]
# 经典模式的**基准**生活费区间（每天）。
#
# 注意：各档位的**实际**数值写在代码里（`engine/config.py` 的
# `DifficultyConfig`），和猫娘参数一样不开放配置：
#   街机   → 无生活费；初始交易本金 7 天 × 15~20（沿用旧口径，数值不变）
#   入门   → 10/天，初始 17 天（≈170）
#   进阶   → 10/天，初始 17 天（≈170）
#   地狱   → 12/天，初始 14 天（≈168）
#
# **初始天数是生存率的唯一旋钮**：初始资金 = 初始天数 × 生活费，所以 30 天总
# 生活费要求的"需翻倍数"恒等于 30 ÷ 初始天数，与每天多少钱无关。
# 17 天 → 翻 1.8 倍（实测生存率 22%）；14 天 → 翻 2.1 倍（实测 8%）。
# 这里的值是**没有覆盖的档位**才用的兜底基准。
living_cost_min = 10.0
living_cost_max = 10.0
# 初始资金 = 初始天数 × 当天生活费
initial_days = 17
# 经典模式总游戏日：第 30 个游戏日结束时自动终局并自动结算
total_game_days = 30

# ---------------------------------------------------------------------------
# 无限模式
# ---------------------------------------------------------------------------
[infinite]
# 初始资金 = 7 天生活费总额
initial_days = 7
# 每天扣的生活费
daily_living_cost = 150.0
# 每周低保 = 7 天生活费总额（**必须主动领**，不领不到账）
weekly_relief = 1050.0
# 高利贷：借多少 / 还多少
loan_amount = 500.0
loan_repay = 600.0
# 三振机制：连续 N 天交不起才斩杀
strike_limit = 3
# 低保发放间隔（天）
relief_interval_days = 7
# 无限模式的 tick 间隔（秒）。经典四档固定 8 秒。
tick_interval_seconds = 30
# 低保补领上限（天）：超过上限的欠款作废
welfare_claim_limit_days = 7
# 每天最多可借款次数
loan_take_per_day = 1

# ---------------------------------------------------------------------------
# 新闻系统
# ---------------------------------------------------------------------------
[news]
# 蜜月期真新闻比例
truth_ratio_honeymoon = 0.70
# 陷阱期假新闻比例（专门诱多）
fake_ratio_trap = 0.50
# 反转日概率区间
reversal_prob_min = 0.15
reversal_prob_max = 0.20
# 反转幅度区间（熊市 -0.40 ~ -0.20，牛市 +0.20 ~ +0.40）
reversal_magnitude_min = 0.20
reversal_magnitude_max = 0.40
# 每局反转日数量
reversal_days_min = 1
reversal_days_max = 3
# 新闻影响 heat 的时间窗（tick）。经典模式 1/4 天、无限模式 1/16 天。
news_window_ticks = 3

# ---------------------------------------------------------------------------
# 分析按钮（返回模糊评级，不返回精确数值）
# ---------------------------------------------------------------------------
[analysis]
# 消耗方式二选一：token 或 tick
cost_mode = "token"
# 代币消耗
token_cost = 5
# tick 消耗
tick_cost = 1

# ---------------------------------------------------------------------------
# 注意：猫娘（NPC）策略参数**不开放**在此处。
# 猫娘的行为规则写死在第三层 engine/npc.py 里（见该文件顶部注释），
# 目的是保证"猫娘与人类玩家走同一套 heat 逻辑、同一个 settle 函数，
# 代码里不存在猫娘豁免分支"这一教学前提，无法被配置悄悄改掉。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 导演模式（P7 · 直播特制版）
# ---------------------------------------------------------------------------
# **默认关闭 = 开源纯净版**：严格遵守原有数学概率，插件层不做任何后台干预。
# 打开后，面板标题栏**长按** 1.2 秒会露出「导演台」，用于直播间整活：
#   * 让指定标的暴跌（复用引擎既有的 apply_jump，不改引擎公式）
#   * 强制发放高利贷（仅无限模式）
#   * 强制断供（触发引擎既有的 welfare_neglect 破产原因）
#   * 立即斩杀
#
# **这些干预全部发生在插件层**，引擎层（engine/）与模式层（modes/）一行不改。
# 纯净版下导演台入口一律返回 error.director_disabled。
[director]
enabled = false
# 暴跌强度系数（0~1）。实际 severity = 0.15 + 0.25 × 该系数 × crash_severity_scale。
crash_severity_scale = 1.0
# 赛博弹窗轰炸：封住操作多少秒（1~30）
# P7.3：这是**上限**，不是保证 —— 面板侧还有一道**客户端硬截止**
# （从第一次看见轰炸起算，到点无条件关窗），防止前端定时器出 bug 锁死屏幕。
boom_seconds = 5
# 赛博弹窗轰炸：屏幕上有多少个小丑（1~200）
boom_emoji_count = 50

# ---------------------------------------------------------------------------
# P19.0：两个**隐藏开关**（仅主播 / 开发者用，面板上没有入口）
# ---------------------------------------------------------------------------
# 这两个开关**必须同时满足上面的 `enabled = true` 才生效** —— 否则
# 「开源纯净版不做任何后台干预」这条承诺就破了（`show_progress` 尤其致命：
# 它会把引擎明令局中隐藏的 heat 摆到面板上）。
#
# 直播时按需要改这两行，**改完 5 秒内生效**（配置有 5 秒缓存）。
force_black_swan = false
show_progress = false

# `force_black_swan`（黑天鹅）——
#   打开后：**玩家单笔盈利刷新本局纪录的那一刻**（卖出赚到钱的瞬间，
#   也就是他最上头的那一秒），把引擎的暴跌提前拉出来：刚卖出的那只
#   加上手里还攥着的每一只，全部排一条暴跌，下一个 tick 生效。
#   暴跌复用引擎既有的 `apply_jump`，**引擎一行不改**，暴跌之后的
#   集中度、收割等后续反应照常发生。**一局只来一次。**
#
# `show_progress`（进度可见）——
#   打开后：面板状态条下方多出两枚徽标 —— 「上头 0.62」（heat）
#   和「第 2/4 章」（剧情进度）。这只给主播看；关着的时候面板与
#   开源纯净版**逐像素一样**。

# ---------------------------------------------------------------------------
# 面板视觉（P7 · 家道中落的**文案**降级；P7.2 · UI 极简重构）
# ---------------------------------------------------------------------------
# 三档：rich（富二代，圆润字体）/ broke（断供，细字体）/ dying（濒临破产，数字闪红）
# 阈值是**表现层**参数，不参与任何游戏规则，也不改引擎数值。
#
# 注意：0.8.0 那套「暗金 / 灰化 / 裂纹」视觉特效已在 0.8.1 **整体回滚**
# （真机把面板 UI 搞崩了），这里只剩**文案**与**字体**两档表现。
[visual]
# 进入「断供」档的天数阈值（经典模式一般 3~5 天就断供）
broke_day_threshold = 3
# 进入「濒临破产」档的总资产阈值（低于它就进入该档）
dying_assets_threshold = 20.0
# 病危的触发：现金为负，或距离斩杀小于该值
panic_distance = 40.0
# 终局 Emoji 海的数量（至少 50）
emoji_sea_size = 60

# ---------------------------------------------------------------------------
# 节奏（P10 · 游戏速度 / 自动·手动）
# ---------------------------------------------------------------------------
# **只改真实时间的推进快慢，一个游戏数值都不碰**：每天多少 tick、行情怎么走、
# 手续费多少、斩杀线在哪 —— 全部不变。引擎层（engine/）与模式层（modes/）
# 一行不改，这里只是把"等多久跳一拍"乘一个系数。
#
#   slow   —— 间隔 × 3（经典模式一个游戏日约 4.8 分钟，适合被日终账单吓到的）
#   normal —— 间隔 × 1（默认，等同 0.9.2 的手感）
#   fast   —— 间隔 × 0.5（手快的人玩）
#
# 想省事就**直接在面板上切**（面板上的选择优先于这里的默认值）；
# 想一劳永逸就改这个文件，然后重启插件。
[game]
game_speed = "normal"
