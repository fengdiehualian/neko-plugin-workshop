# 运行配置模板：N.E.K.O 首次需要运行配置时会把它复制到
#   <用户数据根目录>/plugins/neko_video/config/plugin.toml
# 已存在的用户配置不会被这个模板覆盖。

[plugin_runtime]
enabled = true
auto_start = true

[video]

# 总开关
enabled = true

# 推送方式：
#   read    = 只把事实塞进她当前上下文，**不触发她开口**。
#             她按自己的节奏自然用上这些内容，不会打断她正在说的话。
#   respond = 推给她并**立刻**触发她开口。注意：她自带 10~20 秒一轮的主动
#             搭话，respond 会和她撞车，实测会把她的话反复截断（"几个字一卡"），
#             严重时整段哑掉。
# ★ 一般不用改这个：开 focus_mode 后，看视频时自动用 focus_behavior，
#   平时自动用 read（见下）。
mode = "read"

# ★ 专注视频模式（推荐开启）：
#   只有"B站视频正在播放"时才允许她主动开口吐槽；
#   视频暂停/切走/关掉 → 立刻回到安静状态，不影响日常对话。
#   判定依据是系统媒体会话的播放状态（真实、可靠）。
focus_mode = true

# 专注模式（视频正在播放）下的开口方式：
#   respond = 立即触发她开口（默认；能精准踩高光点吐槽）
#   read    = 只塞上下文不开口（最不打扰，但高光踩点失效）
focus_behavior = "respond"

# 是否随推送附带"那一刻的画面截图"（默认 false）。
# ★ 猫娘自带看屏幕能力，画面她本来就看得到；插件推的预览图分辨率更低。
#   只有你的猫娘没开屏幕共享/视觉模型时，才建议打开这个兜底。
push_frame = false
# 收尾时是否附带**高赞评论的配图**（默认 true）。
# B站评论区大量是"梗图+一句话"，把图给她"看"她才能懂评论区的笑点。
# 这**不是**屏幕截图，所以默认开着。
push_comment_images = true

# ★ 高光点驱动，不是定时开口：
#   插件算出弹幕密度的高峰（= B站进度条上那几座"山峰"），
#   视频播到某个峰值那一刻，她就针对那个点说一句。

# 两次开口的**最短**间隔（秒）—— 唯一目的是"别把上一句话吞了"，
# 不是"必须多少秒说一次"。想让她更密就调小。
min_gap_seconds = 18.0

# 高光点过期窗口（秒）：播过去超过这么久就不补报了（用户拖进度条时用）
hotspot_grace_seconds = 90.0

# 最多取几个高光点（= 进度条上最高的几座"山峰"）
max_hotspots = 5

# 播完后是否读高赞评论做收尾
comment_on_end = true

# 摘要里最多写几条高赞评论
max_comments = 3

# 最多拉多少条弹幕用于算节奏图
max_danmaku = 600

# 只在 B站窗口处于前台时才识别
only_when_foreground = false

# 兜底：手动指定一个 BV 号（留空=自动检测）
manual_bvid = ""

# 是否把那坨"视频事实"作为插件气泡显示在聊天窗里
#   false（默认）= 用户只看到猫娘自己的话（推荐）
#   true         = 额外气泡显示原始事实，便于调试
show_facts_in_chat = false

# ★ 读系统媒体会话（SMTC）获取**真实播放位置 / 倍速 / 播放状态**（Windows）。
#   解决"用户开倍速、拖动进度条时，按墙钟估算的进度会失真"的问题。
#   读不到（别的系统/浏览器不上报）时自动退回墙钟估算，功能不受影响。
use_media_session = true
