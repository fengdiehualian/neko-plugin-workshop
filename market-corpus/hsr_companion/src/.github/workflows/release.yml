# Generated by neko-plugin
# managed-template: plugin-market-actions-v1
name: Release N.E.K.O Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # v0.9.6 uses verified frozen assets uploaded separately; never overwrite them.
    if: github.ref_name != 'v0.9.6'
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-release.yml@main
    with:
      plugin-id: hsr_companion
      neko-repository: Project-N-E-K-O/N.E.K.O
      neko-ref: main

  vision-assistant:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v0.9') && github.ref_name != 'v0.9.6'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build standalone loopback assistant
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r assistant_runtime/requirements-build.txt
          python scripts/build_assistant.py --tag "$env:GITHUB_REF_NAME" --repository "$env:GITHUB_REPOSITORY"
      - name: Attach assistant assets to plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload $env:GITHUB_REF_NAME `
            dist/hsr-vision-assistant-win-x64.zip `
            dist/hsr-vision-assistant-manifest.json `
            --clobber
