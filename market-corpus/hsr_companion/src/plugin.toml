description = "立即停止读取星铁窗口；玩家档案、纠错和当前陪玩会话仍保留。"
input_schema = { "type" = "object", "properties" = {  } }
kind = "action"
auto_start = false
model_validate = true
llm_result_fields = ["observer"]
llm_result_schema = { "type" = "object", "properties" = { "observer" = {  } }, "required" = ["observer"] }

[[plugin.entries]]
id = "stop_companion_session"
name = "结束星铁陪玩会话"
