description = "暂存从截图或自然语言中整理出的角色列表，等待玩家确认后再写入正式档案。"
input_schema = { "type" = "object", "properties" = { "recognized_characters" = { "type" = "array", "items" = { "type" = "string" } }, "uncertain_characters" = { "type" = "array", "items" = { "type" = "string" }, "default" = [] }, "import_mode" = { "type" = "string", "enum" = ["merge", "replace"], "default" = "merge" }, "source" = { "type" = "string", "enum" = ["chat", "voice", "screenshot", "panel"], "default" = "chat" }, "confidence" = { "type" = "string", "enum" = ["high", "mixed", "low"], "default" = "mixed" }, "note" = { "type" = "string", "default" = "" } }, "required" = ["recognized_characters"] }
kind = "action"
auto_start = false
model_validate = true
llm_result_fields = ["proposal", "confirmation_required", "rejected_characters"]
llm_result_schema = { "type" = "object", "properties" = { "proposal" = {  }, "confirmation_required" = {  }, "rejected_characters" = {  } }, "required" = ["proposal", "confirmation_required", "rejected_characters"] }

[[plugin.entries]]
id = "start_auto_observation"
name = "开始自动观察星铁窗口"
description = "经玩家明确开启后，只采集星铁窗口；切换聊天不影响观察，最小化或关闭游戏时暂停。画面仅在内存中处理，不操作游戏。"
input_schema = { "type" = "object", "properties" = {  } }
kind = "action"
auto_start = false
model_validate = true
llm_result_fields = ["observer", "session"]
llm_result_schema = { "type" = "object", "properties" = { "observer" = {  }, "session" = {  } }, "required" = ["observer", "session"] }

[[plugin.entries]]
id = "start_companion_session"
name = "开启星铁陪玩会话"
