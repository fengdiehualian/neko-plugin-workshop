# 和猫娘一起开飞机（简单飞机2副驾驶）—— 配置示例
#
# 实际的配置在 N.E.K.O 的插件设置里改（也可以在「副驾驶仪表盘」面板的设置页改），
# 这个文件只是说明每个选项的含义。

[sp2_copilot]

# SP2-Bridge 模组在游戏内监听的地址。
#
# 改端口要改**两处**：
#   1. 模组侧的配置（port）
#   2. 这里的 bridge_url
# 只改一处两边就连不上。模组侧改完需要重启游戏。
#
# 本项目其它桥接插件的端口（避免撞车）：
#   juno_bridge = 21577、sfs_bridge = 21578、ksp_bridge = 21579
bridge_url = "http://127.0.0.1:21580"

# 单次请求超时（秒），范围 3-60。
#
# SP2 在下面这些时刻可能会卡一下，读遥测就会慢一拍：
#   - 正在加载存档 / 切换场景 / 进入或退出设计器
#   - 联机卡顿
#   - 机体零件特别多
# 机器较慢可以调大；调小则能在「游戏没开」时更快报错。
timeout_seconds = 12

# 仪表盘自动刷新间隔（秒），范围 1-30。
# 只影响面板轮询频率，不影响对话里的工具调用。
poll_interval_seconds = 3

# ─────────────────────────────────────────────────────────────────────────
# 自动播报：游戏在跑的时候，插件自己在后台读仪表，把最新状态放进角色的上下文，
# 于是每回对话一开始角色就已经知道飞机什么状况 —— 不用等你开口才去调工具。
#
# 它用的是 push_message(ai_behavior="read")：
#   - 不打断对话、不弹提示，只是「让角色提前看到」
#   - 同一时刻只保留最新一条，轮询再频繁也不会把上下文撑爆
#   - 游戏没开时完全不播报，不会往上下文里灌噪音
# ─────────────────────────────────────────────────────────────────────────

# 关掉它就退回旧的问答式行为：只有你问了才读仪表。
auto_brief_enabled = true

# 播报间隔（秒），范围 5-120。
# 坠机、失速这类突变最迟一个间隔内就会被播报，所以没必要调得很小。
auto_brief_interval_seconds = 20

# ─────────────────────────────────────────────────────────────────────────
# 告警阈值：只影响「什么时候提醒你」，不影响游戏本身，也不会给游戏发任何指令。
# ─────────────────────────────────────────────────────────────────────────

# 近地告警高度（米），范围 30-1000。
# 离地高度低于这个值且仍在下降，就报近地告警。
terrain_warning_agl_m = 300

# 下降率告警（m/s），范围 1-30。
# 在 terrain_warning_agl_m 以下时，下降率超过这个值就报警。
sink_rate_warning_mps = 6.0

# 坡度告警（度），范围 15-90。
# 滚转角绝对值超过这个值就报警；超过它的 1.3 倍升级为紧急。
bank_warning_deg = 45.0

# 低油量告警（%），范围 1-50。
# 剩余油量低于这个值提醒；低于它的四分之一升级为紧急。
low_fuel_warning_percent = 20.0

# 迎角告警（度），范围 5-30。
# 迎角超过这个值提醒「接近失速」；超过它的 1.3 倍升级为紧急。
aoa_warning_deg = 12.0

# 超速预警比例，范围 0.5-1.0。
# 空速达到 Vne 的这个比例就提前提醒。机体没提供 Vne 时本项不生效。
overspeed_warning_ratio = 0.9
