[pytest]
# 这个 inifile 的作用不是配置，而是把 pytest 的 rootdir 钉在 tests/。
#
# 仓库根有 __init__.py（它就是插件入口 module，`plugin.plugins.neko_stellaris`），
# 而仓库目录名不是合法 Python 标识符（含 - 或 .）；rootdir 落在仓库根时 pytest
# 会去 import 那个 __init__.py 当包，于是相对导入直接炸（"attempted relative
# import with no known parent package"）。把这个文件放在 tests/ 之后
# rootdir = tests/，`pytest tests` 和 `pytest <绝对路径>` 两种调法都正常。
testpaths = .
