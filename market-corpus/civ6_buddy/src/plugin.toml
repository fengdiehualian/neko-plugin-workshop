[plugin]
id = "civ6_buddy"
name = "文明6陪玩"
description = """
文明6（Civilization VI）陪玩伙伴：帮你把「每回合的重复操作」自动化，让你专心打仗和决策。

■ 自动托管运营（你只需看着或去打仗）
YUI 会替你处理每回合的杂活，全部基于游戏官方数据（FireTuner），不是瞎点：
• 自动推进回合：点「下一回合」前先处理完所有挡路的事（弹窗、待选科技/市政、待任命总督、单位待指挥等）
• 自动选科技与市政：按当前局面（人口/金币/地形/军力）从政策库里选最优解，不再机械乱点
• 自动填政策槽、选万神殿、任命总督、单位自动升级（只强化不引战）
• 侦察兵自动探路（远离首都、避开水/山/己方单位），战斗单位不主动开战——打仗归你
• 自动处理卡死弹窗（自然奇观发现、尤里卡提示等），不再卡回合
• 外交自动化：自动向最近的城邦派使节；实时读取各文明关系、文化产出、经济面板
■ 深度局面洞察
• 解析你的存档：回合数、地图、你的文明/领袖/特性、所有敌对文明、城邦列表、已装 MOD
• 给出开局/科技/建城/战争/胜利路线建议（规则化、可追溯，不是空话）
■ 怎么开始
跟 YUI 说「开始托管文明6」即可；托管期间可随时要求「交还」手动操作。
■ 边界与安全
• 读取全部用官方通道（存档解析 + FireTuner），纯只读，不改你的存档
• 每一步操作后真实截图验证，识别不了就停下来如实告诉你，绝不瞎点、不挂机、不编状态
• 自动装 Steam SDK（appid 597260）时只做最小必要安装，可随时关掉
■ 版本：v0.6.x 已完成运营写链路（官方 API 生产/科研/单位/弹窗/政策槽/万神殿/外交）、实机多回合连续推进验证、卡死弹窗修复与自愈兜底。
"""
short_description = "文明6陪玩：YUI 按官方数据自动托管运营（推回合/选科技市政/填政策/探路/关弹窗/派使节），你专心打仗；存档解析+FireTuner 只读，每步截图验证，不瞎点不挂机"
keywords = ["文明6", "Civilization VI", "Civ6", "陪玩", "自动回合", "托管运营", "科技", "市政", "政策", "万神殿", "总督", "侦察兵探路", "弹窗处理", "外交使节", "FireTuner", "存档解析", "Civ6Save", "局面洞察", "胜利路线", "城邦", "领袖", "不瞎点", "截图验证", "键鼠接管", "交还", "situation", "advisor", "buddy", "coach", "takeover", "官方API"]
version = "0.6.6"
type = "plugin"
entry = "plugin.plugins.civ6_buddy:Civ6BuddyPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "使用说明"
entry = "docs/guide.md"
