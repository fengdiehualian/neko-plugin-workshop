# 运行时配置示例（安装时由 N.E.K.O 复制到运行时 config/plugin.toml）
# 这里只放“可变默认值”，不要放 [plugin] 元数据表。
[plugin_runtime]
enabled = true
auto_start = true

# 插件自定义配置（运行时可通过 self.config.dump() 读取）
[bililearn_bridge]
# BiliLearn Web.exe 的绝对路径。留空即可：插件开箱即用——本地没装时自动从
# GitHub release 下载安装包（多镜像源自动切换）并解包到插件数据目录。
exe_path = ""
# 本地找不到 BiliLearn 时，是否自动下载/解包安装包（默认 true，即开箱即用）
auto_install = true
# Web 面板端口。留空/默认即可：插件会优先读 BiliLearn 账户注册表里的真实端口，
# 仅在读取不到时才用这里的值（默认 18083）
port = 18083
# 启动模式：serve=无头服务器（推荐，单进程即服务）；silent=无头且无系统托盘
launch_mode = "serve"
# 宿主启动 N.E.K.O 时是否自动拉起 BiliLearn（不弹面板，仅后台运行）
auto_launch = true
# 面板登录账号。留空时默认尝试 BiliLearn 首次启动预置的本地账号 yaya/yaya。
# 如果你在面板里改过密码，请把新密码填到 panel_password。
panel_username = ""
panel_password = ""
# 面板尚未创建账号时，是否自动创建一个（凭据存到插件数据目录，不会碰已有账号）
auto_setup = true
# 单个 HTTP 请求超时（秒）
request_timeout = 20
# 额外的 exe 搜索目录（可选）；插件会在这些目录下浅层查找 "BiliLearn Web.exe"
# search_dirs = ["D:\\Tools", "E:\\BiliLearn"]