name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-verify.yml@main
    with:
      plugin-id: bililearn_bridge
      neko-repository: Project-N-E-K-O/N.E.K.O
      neko-ref: main
    secrets: inherit

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Run smoke tests
        # 用 unittest 而非 pytest：本插件按 N.E.K.O 规范把代码放在仓库根的 __init__.py，
        # pytest 会把仓库根当成包去 import __init__.py（触发 plugin.sdk 依赖报错）；
        # unittest 走命名空间包加载，不会执行根 __init__.py，规避该问题。
        run: |
          uv venv
          uv run python -m unittest tests.test_smoke -v
