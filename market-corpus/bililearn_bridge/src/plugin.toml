[plugin]
id = "bililearn_bridge"
name = "BiliLearn 桥接"
type = "plugin"
description = "让 N.E.K.O 猫娘完整操控独立的 BiliLearn（B站 AI 学习机器人）程序：无头拉起其 exe（不弹面板），自动完成面板登录，并把 BiliLearn 3.1.6 的全部 308 个 Web API 接入为猫娘可控入口（含通用透传与接口检索）。纯标准库，无需额外依赖。"
short_description = "猫娘的 BiliLearn 全功能桥：拉起程序、自动登录、操控所有接口。"
keywords = ["bilibili", "b站", "学习", "bililearn", "bridge", "桥接", "机器人", "video", "刷视频", "知识库"]
version = "2.0.2"
entry = "plugin.plugins.bililearn_bridge:BiliLearnBridgePlugin"

[plugin.author]
name = "bxy"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
