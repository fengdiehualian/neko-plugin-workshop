[plugin]
name = "猫娘邮件秘书"
description = "让猫娘帮你管理QQ邮箱，生成邮件摘要、判断优先级、标记已读、发送邮件（支持附件）。支持新邮件轮询推送、智能分类、去重校验。清新诗意的前端界面，支持i18n多语言。配置详见 README。"
short_description = "Catgirl mail secretary — QQ mailbox summaries, priority classification, mark read, send emails with attachments."
keywords = ["邮件", "邮箱", "email", "mail", "QQ邮箱", "IMAP", "SMTP", "摘要", "猫娘", "附件", "轮询", "推送", "メール", "메일", "почта", "correo"]
version = "0.3.2"
id = "neko_mail"
entry = "plugin.plugins.neko_mail:NekoMailPluginEntry"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = false

[neko_mail]
# QQ 邮箱地址 (必填, 例如: your_email@qq.com)
email_addr = ""
# QQ 邮箱授权码 (必填, 16位, 在 QQ 邮箱设置中生成)
auth_code = ""
# IMAP 服务器
imap_server = "imap.qq.com"
imap_port = 993
# SMTP 服务器
smtp_server = "smtp.qq.com"
smtp_port = 465
# 高优先级发件人(逗号分隔,匹配发件人地址中的任意子串)
high_priority_senders = ""
# 要忽略的文件夹(逗号分隔)
ignore_folders = ""
# 猫娘对用户的称呼(支持猫娘自主决定或与用户协商)
master_name = "主人"
# 猫娘的自称
catgirl_name = "喵喵"
# 新邮件轮询间隔（秒），默认 300 秒（5 分钟）
polling_interval = 300
